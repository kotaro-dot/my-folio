var CHUNKS={'t001':'In his search for more comfortable living,|modern man|sometimes makes|for his fellow men|and even for himself|an environment|which turns out to be|potentially harmful to health.','t002':'Many people|seem to have built their lives|around the notion|that they are in some way|indispensable to children,|and to question this|is to attack|the very center of their being.','t003':'I heartily wish|that in my youth|I had had someone of good sense|to direct my reading.|I sigh|when I reflect on the amount of time|I had wasted|on books that were of no great profit to me.|What little guidance I had|I owe to a young man|who came to live with my family|in Heidelberg.','t004':'Change in the whole social system|is inevitable|not merely because conditions change|but because people themselves change.|We change|as the years go on.|New feelings arise in us,|old values depreciate,|new values arise.|Things we thought|we wanted most intensely|we realize|we don\'t care about.|The things we built our lives on|crumble and disappear,|and the process is painful.','t005':'Science|is based on|careful observation and experiment|by which scientists|can construct theories|that connect different experiences.|They seek regularities|in the workings of nature|which hopefully reveal|the fundamental laws|that govern the behavior|of matter and forces.|Central to this approach|is the willingness of the scientist|to abandon a theory|if evidence is produced against it.','t006':'Strange to say,|technology,|although of course the product of man,|tends to develop|by its own laws and principles,|and these are very different|from those of all natural things.|Nature always, so to speak,|knows where and when to stop.|Greater than the mystery of natural growth|is the mystery|of the natural stopping of growth.','t007':'Agriculture|was a step in human progress|to which subsequently|there was nothing comparable|until our own machine age.|Agriculture|made possible|an immense increase|in the number of the human species|in the regions|where it could be successfully practiced.','t008':'I think it extremely dangerous,|so far as Western civilized communities are concerned,|to imagine|that there are better systems than democracy.|It is not so much|that democracy is positively good|as that it makes impossible|certain great evils|which are apt to exist|under other systems.','t009':'A general disarmament scheme,|to be successful,|must deprive each nation|of the ability|to inflict a catastrophic blow|on the other;|at the least,|it must not given an advantage|to either side.','t010':'The actions of men|were said to be governed|by the faculty of reason,|those of animals|by the faculty of instinct,|and this attribution|of the action of animals|to instinct|seems to have disguised|from most of those|who used the word|the need for further study|or explanation of them.','t011':'The great development|of electrical signaling devices|and the vast improvements|which have taken place|during the past century|in the means of transportation|have reduced|to comparative insignificance|the time element|in communication.','t012':'The revivals of memory|are rarely literal.|We naturally remember|what interests us.|The past|is recalled|not because of itself|but because of what it adds|to the present.','t013':'French parents do their best|to develop the child\'s intelligence|as rapidly as possible.|They have little patience|with childish ideas|even if they do not go so far|as to look upon childhood|as an unfortunate but necessary prelude|to adult life.','t014':'Man is a history-making creature|who can neither repeat his past|nor leave it behind;|at every moment|he adds to|and thereby modifies|everything that had previously happened to him.','t015':'We can view utterances|as acts of various kinds|and the exchanges of utterances|that we call conversations|as exchanges of acts.','t016':'To think|that physical comfort|makes for human relations|is an error|we make|because the absence of all comfort|interferes with good relations.|But we base it|on the correct observation|that when a parent|takes pleasure|in going out of his way|to provide comfort for his child,|the child|takes it as a proof|that he is loveable|and deserves care and respect.','t017':'It was by learning|that we ceased to be animals|and made ourselves into men.|That was the first stage.|It was then,|far back in the warm jungles,|that the wonderful human brain|was gradually formed,|and with it|our fantastically intricate speech|and our ingenious adaptable hands.','t018':'Literary critics blame journalism|for not being literary enough,|historians|for lacking historical accuracy,|lawyers|for not arranging facts|by the rules of evidence.|But journalism is not literature,|not history, not law.','t019':'Now, there is no doubt|that in a modern society|there is not enough meaningful work|to make it possible|for most people|to derive the meaning in their lives|from the work they do|to earn a living.|For it is a peculiarity|of a modern society|that the existence of millions|depends on being paid|for doing|what seems like nothing|when done.','t020':'It is unusual now|for a father to work at home,|and his children rarely,|if ever,|see him at his place of work.','t021':'We are children|only once,|and then only|for a few short years.|But these|are the most impressionable years|of a lifetime.|Never again|will the world|and everything in it|be so excitingly new,|so filled with wonder.|Never again|will physical, mental, spiritual growth|be so natural|and unavoidable.','t022':'Only after considerable public debate|did towns in Great Britain|adopt Greenwich time.|Many were reluctant to do so|but by 1855|ninety-eight percent of public clocks|were set to Greenwich time.','t023':'So intimate|is the relation|between a language|and the people who speak it|that the two|can scarcely be thought of apart.|A language|lives|only so long as|there are people|who speak it|and use it as their native tongue,|and its greatness|is only that given to it|by these people.','t024':'A four-year-old girl|became devoted|to a bird book|with large colored pictures|which someone lent her.|This|became her inseparable companion,|and she|preferred it|to all other books.|By the time|she was out of the house again|she could name correctly|every bird in the book,|and so could|the weary adults|who had read it to her,|over and over.','t025':'Our answer to the evils of technology|is more and better technology.|If rivers are becoming polluted,|the solution is, we reason today,|to develop stronger,|and therefore costlier, antipollutants.','t026':'The ordinary man|will never be rid|of the fallacy|that words obey thought,|that one thinks first|and phrases afterward.|There must first,|it is true,|be the intention,|the desire to utter something,|but the idea|does not take shape|until it is phrased.','t027':'It is only quite recently|in human history|that it has come to be fairly widely accepted|that all human beings|are fundamentally alike;|that they share|the same basic interests.','t028':'Strange to say,|of all the irrational fears|undoubtedly|the strongest and most common one|is the fear|of speaking in public.|Why is it|that the simple act|of standing|in front of a group of people|and talking to them|for a few minutes|should produce|such astonishing physical reactions?','t029':'If you are indecisive|and plan to do something about it,|you can take immediate comfort|in the fact|that indecision is not necessarily due|to ignorance and slow thinking.|On the contrary|it is often thinking of so many things|and consideration of so many doubts|that result in the difficulty|to reach and act on a simple decision.','t030':'Friendship is above reason,|for, though you find virtues in a friend,|he was your friend|before you found them.|It is a gift|that we offer because we must;|to give it as the reward of virtue|would be to set a price upon it,|and those who do that|have no friendship to give.','t031':'We realize|that humans could not have become thinkers|had they not at the same time been makers.|Humans made tools,|but tools also helped make humans|the adaptive and flexible creatures|they have become.','t032':'Many college teachers|do not call a roll|or enforce attendance at their lectures,|but you would be unwise|to conclude from this|that you need not go to them,|and even more unwise to conclude|that you can stay away|from practical classes and seminars.','t033':'Athletes do not perform or compete|in social vacuums.|One could even argue|that modern athletics would not exist|without audiences and sport fans.|How many athletes|would continue to train and compete|if no spectators were present|in athletic event?|Probably none.','t034':'Most people,|when they are left free|to fill their own time|according to their own choice,|are at a loss|to think of anything|sufficiently pleasant|to be worth doing.|And whatever they decide on,|they are troubled|by the feeling|that something else|would have been pleasanter.','t035':'Twenty-five years or so ago,|when I was very young indeed|and the world was not yet so uncomfortable a place|as it has since become,|I remember hearing|a wise old gentleman remark|that, in his opinion,|the French revolution was a great mistake.','t036':'If you will mount the saddle|and travel right along with an author|toward the destination|that he has in mind,|your reading journey|will be much more swift and sure|than if you travel|with a goal of your own|which differs from his.','t037':'Medical evidence|indicates|that women|on the average,|though not so strong as men|in muscular development,|are less prone to disease,|and though they|may complain more frequently|of minor illness,|they live longer.','t038':'The emotions of sympathy, love, anxiety,|grief, anger, fear|can sometimes be more adequately expressed|without words.|The same is true|of joy, relief and amusement.','t039':'The sunshine|that falls each year|on roads in the United States|contains|twice as much energy|as does the fossil-fuel|used annually|by the entire world.','t040':'Sight|conveys more information|about the outside world|than does|any of the other human senses.|This|is shown|by the large part of the brain|devoted to analysing|visual sensations.','t041':'Today,|we do not expect|our children to work,|either at home|or in a factory.|They|contribute nothing|to the economic well-being|of the family.|They are freer|than they have ever been|before|simply to be children.|We see them|as the centre of the family,|around which|the rest of life revolves.','t042':'Without the aggressive, active side|of his nature|man would be even less able|than he is|to direct the course of his life|or to influence the world around him.','t043':'Television|has opened windows|in everybody\'s life.|No newspaper|has ever reached|so many people|and shown so clearly|what was happening|right now|in their own country|and everywhere else.','t044':'In no respect|do Japanese and Americans|display greater difference|than in their attitude|concerning employment.|When a Japanese|graduates|from a high school or university|he is likely to seek|a position|that will provide him|with lifetime employment.|Taking a job|is thus|as important a step|as taking a wife,|and the results|are likely to last as long.','t045':'If you choose your friends|on the ground|that you are virtuous|and want virtuous company,|you are no nearer to true friendship|than if you choose them|for commercial reasons.','t046':'No one can tell another person|in any definite way|how he should think,|any more than|how he ought to breathe|or to have his blood circulate.','t047':'Anybody who travels to Japan|by way of Asia|must feel on arrival|that he has entered a semi-Western environment.|Yet the longer he remains in the country,|the more clearly he will perceive|that Western ideas and techniques|sometimes undergo a subtle but definite change|when planted to Japan.','t048':'The primary aim of science|is to find truth, new truth.|This search is the more successful|the more it is directed|towards finding truth for its own sake,|regardless of its possible practical use|or application.','pp001':'Frank talks|between an adolescent and his parents|often reveal|that the adolescent is basically willing|to rely on his parents|for protection|in many situations.','pp002':'On the ability of individuals|to learn to live in harmony with others|depends the future|of mankind and the world.','pp003':'Among topics|we discussed over lunch|was the regrettable habit|film directors then had|of altering the plot of a novel|to suit themselves,|to the extent even|of changing a sad ending|into a happy one.','pp004':'The scientist and the theologian|approach|the deep questions of existence|from utterly different starting points.|Science|is based on|careful observation and experiment|enabling theories to be constructed|which connect different experiences.|Regularities|in the workings of nature|are sought|which hopefully reveal|the fundamental laws|that govern the behavior|of matter and forces.|Central to this approach|is the willingness of the scientist|to abandon a theory|if evidence is produced against it.','pp005':'And since the kings|were more likely than the farmers|to influence world events|and to have biographies written about them,|what we know of history|has been largely shaped|by the careers of famous men.','pp006':'I do not consider|that making no mistakes is a blessing.|I have erred once,|but I shall not make the same mistake again.|Nothing is gained|by wasting time in regretting mistakes.|It is much better|to employ that time|in analyzing and correcting what is wrong.|The greatness of man|does not lie in his being faultless.|Error is sometimes inevitable.|The real virtue of man lies|in recognizing that faults can be set right|and in striving to correct them.','pp007':'To write about human aggression|is a difficult task|because the term|is used|in so many different senses.|Aggression|is one of those words|which everyone knows,|but which are nevertheless|hard to define.|One difficulty is|that there is no clear dividing line|between those forms of aggression|which we all deplore|and those|which we must not disown|if we are to survive.','pp008':'Yet it is|a very plain and elementary truth|that the life,|the fortune,|and the happiness|of every one of us,|and more or less,|of those who are connected with us,|do depend upon|our knowing something|of the rules of a game|infinitely more difficult|and complicated than chess.','pp009':'It might be said|that every dictionary|is the dictionary of a dead language.|No matter how fast and how thorough|a dictionary-maker may be,|by the time|he has gathered his words,|written descriptions of them,|and published his book,|old words will have changed|and new ones will have come into being.','pp010':'Earlier studies suggested|that the link was proved.|More recent research suggests|that the damage is more subtle.|Teenagers do not see a murder on TV|and feel encouraged|to knife someone|as a direct result.','pp011':'To form a society|individuals|must be related|in a certain manner.|For instance,|if people|do not communicate|with each other,|if they are perpetually|in aggressive physical combat,|if they do not cooperate|with each other,|and do so routinely|over a period of time,|then their interactions|are not social|and they don\'t constitute a society.','pp012':'The fact|that animals lose|their knowledge of things|as time goes by,|and consequently|their interest in them,|accounts for|their absurd behavior|in many situations.|They|constantly interrupt|one line of action|to do something else,|and they may come back|to the first activity|or forget it altogether.|Human beings,|on the other hand,|thanks to language,|are able to pursue|one purpose|or to act|in relation to a principle|or to an ideal|over long periods of time.','pp013':'Without language,|man would communicate|only simple thoughts, ideas, and experiences.|But with language,|he can talk to other men|and he can put his talk into writing|for other men to read.|By these means|he can make known to others|all of his thoughts, ideas, feelings, and experiences.','pp014':'However, I feel|that the teacher\'s role|is more fundamental than the critic\'s.|It comes down ultimately, I think,|to the fact|that his first obligation is|to the truth of the subject he is teaching,|and that for the reading of literature|ever to become a habit and a pleasure,|it must first be a discipline.','pp015':'\'Popular\' music|can be said to comprise|all the various kinds of music|that might not be considered|under the general heading|of \'serious\' or \'classical\' music.|The division|between the two worlds|has always been|fairly clearly defined,|with those active in one sphere|rarely trespassing in the other,|and never more so|than today,|when,|instead of the distinction|being based|on fluctuating artistic \'taste\',|it is fairly firmly based|on economic considerations.','pp016':'The first great change|in their life style|came|when,|instead of hunting and gathering|animals and plants,|they brought them together|and looked after them|in a single location.|This|eliminated|the element of danger|present in hunting|and reduced|the probability of starvation,|as there was no longer|the possibility|of returning empty-handed|from a foraging expedition.|It was the beginning|of agriculture.','pp017':'Where do the pollutants|come from?|There are two main sources -|sewage and industrial waste.|As more detergent|is used in the home,|so more of it|is finally discharged|with the sewage|into our rivers, lakes and seas.|Detergent|harms water birds|by dissolving|the natural fatty substances|which keep their feathers waterproof.|Sewage itself,|if it is not properly treated,|pollutes the water|and prevents|all forms of life|in rivers and the sea|from receiving the oxygen|they need.','pp018':'Even when the sexism|is not built|into the grammar and usage,|as it is|in French and English,|the speech community|often regards|masculine values|as the norm.|Successive generations|unconsciously absorb|sexism in language|because each speech community|conveys to its children|both a way|to construct grammatical sentences|and a value system|for the use of its language.','pp019':'It is not uncommon|for strained relationships|to develop|between an adolescent|and his parents.|In his great eagerness|to achieve adult status,|the young person|may resent|any restrictions|placed upon him.|Oftentimes|he is not willing to admit,|even to himself,|that he has doubts and fears|about taking on|adult responsibilities and freedom.|The adolescent|may say|that his parents|are over-anxious and over-protective|whereas,|though not aware of it,|he is projecting|his own anxiety into them.','pp020':'Although the city dweller\'s dealing|with people whom he doesn\'t know very well|gives him, on the one hand,|a certain degree of freedom|that he would not have|if he were dealing with family and friends|in a small town,|he loses, on the other hand,|the sense of security|that comes from living|in a close-knit community.','pp021':'The assertion|that mathematics has been a major force|in the molding of modern culture,|as well as a vital element of that culture,|appears to many people incredible,|or at best, an extreme exaggeration.|This disbelief is quite understandable|and results from a very common|but mistaken conception|of what mathematics really is.','pp022':'The crucial issue is|whether the essence of life|resides|in the heart or in the brain.|Because the body|rarely shuts down|all its systems at once,|and because hospitals|have access to|the most modern life-preserving machinery,|it is entirely possible|that the brain,|deprived of|an adequate supply of oxygen,|could die|while the patient,|often with the help|of hospital equipment,|remains alive.','pp023':'In the world of nature|there are always compensations.|As a country lad,|I became familiar at an early age|with the farming maxim|that there is never a year|when every crop succeeds,|nor when every crop fails.|In recent years|a farming elite and its advisers|have started to assume otherwise.|They have been convincing themselves|that if they prepare their plans|according to the latest scientific knowledge|and put them efficiently into practice,|success is assured.','pp024':'The social experiences and values|of the old and the young|have always been in conflict;|if younger people|did not question|the advice and beliefs|of their parents,|little change of progress|would ever occur.|But with the accelerating speed|of change in modern times,|the conflicts|between members|of different generations,|or between those people|anxious to adjust to change|and those less inclined to do so,|were in danger of becoming|more harmful than helpful.|Furthermore,|the very phrase|by which these conflicts are described,|the generation gap,|was becoming out of date.','pp025':'By reason of the fact|that educated English|is thus accorded|implicit social and political sanction,|it comes to be referred to|as Standard English,|and provided we remember|that this does not mean|an English that has been formally standardized|by official action,|as weights and measures are standardized,|the term is useful and appropriate.','pp026':'There is general apathy to|if not positive distrust of|science itself as a search for truth;|for, to the ordinary American,|science is identified with mechanical inventions.|Ask an American|to name the greatest scientist of this country|and he will very likely reply, Edison.|As a nation,|we respect only the practical application of science|and have regard for the efforts|of inventors and promoters|rather than those of the scientific discoverers.','pp027':'Today,|we do not expect|our children to work,|either at home|or in a factory.|They|contribute nothing|to the economic well-being|of the family.|They are freer|than they have ever been|before|simply to be children.|We see them|as the centre of the family,|around which|the rest of life revolves;|we protect them|from responsibilities|which were forced|on earlier generations.','pp028':'The aggressive part|of human nature|is not only|a necessary safeguard|against savage attack.|It is also the basis|of intellectual achievement,|of the attainment of independence,|and even of that proper pride|which enables a man|to hold his head high|amongst his fellows.|Without the aggressive, active side|of his nature|man|would be even less able|than he is|to direct the course of his life|or to influence|the world around him.','pp029':'The sheer numbers of Europeans|who left their homelands|in the century before 1914|to go overseas|suggest how important was the movement|of which they were a part.','pp030':'I have always wondered|at the passion many people have|to meet the celebrated.|The prestige you acquire|by being able to tell your friends|that you know famous men|proves only|that you are yourself of small account.','pp031':'Manual labor|was highly valued.|Later|it was the man|who worked with his head|to achieve success|in business and industry|who was looked up to.|Now there is in America|a curious combination|of pride|in having risen to a position|where it is no longer necessary|to depend upon manual labor|for a living|and genuine delight|in what one is able to accomplish|with his hands.','pp032':'In fairy tales,|as in life,|punishment or fear of it|is only a limited deterrent|to crime.|The conviction|that crime does not pay|is a much more effective deterrent,|and that is why|in fairy tales|the bad person|always loses out.|It is not the fact|that virtue wins out at the end|which promotes morality,|but that the hero|is most attractive to the child,|who identifies with the hero|in all his struggles.|Because of this identification|the child|imagines|that he suffers with the hero|his trials and hardships,|and triumphs with him|as virtue is victorious.','pp033':'The thing|that saves most of us|from feeling terrible|about our limited intellect|is some small part|of our personality or character|that makes us different.|Being uniquely ourselves|makes us feel better|about not being smart.|It\'s those little differences|we have|that keep us|from committing suicide|when we realize,|early in life,|that a lot of people|have more brains|than we have.','pp034':'A puppy raised apart from other dogs|will know how to bark|when he gets old enough,|but the few children we know of|who grew up without human contact|grew up almost mute.|Babies in understaffed foundling hospitals,|who see very little of older people,|are said,|except for crying,|to be almost silent.','pp035':'Most of our knowledge,|acquired from parents, friends, schools,|newspapers, books, conversation, speeches, and radio,|is received verbally.|All our knowledge of history, for example,|comes to us only in words.|The only proof we have|that the Battle of Waterloo ever took place|is that we have had reports to that effect.','pp036':'You must learn to walk|before you can run|recognizes that there are stages in learning|which must be taken in the right order|if success is to be achieved.','pp037':'Foreign language instruction|should come early|in the educational process,|basically at the elementary level.|This is because|it can serve as a fundamental shaper|of the child\'s perception of the world.|It can help him accept the fact|that there is much in the world|that differs greatly|from what he sees around him|and to which|he must learn to adapt himself.','pp038':'Today|the scale|of Western European pet-keeping|is undoubtedly unique|in human history.|It reflects the tendency|of modern men and women|to withdraw|into their own small family unit|for their greatest emotional satisfactions.|The fact|that so many people|feel it necessary|to maintain a pet|for the sake|of emotional completeness|tells us something|about the present-day society|in which we live.','pp039':'The door,|as the main point of entry into a house,|has always had a place|of particular importance in superstition,|and the positioning over the porch|of statue and good luck symbols|has been specifically|to keep out bad elements|either human or supernatural.','pp040':'In the age of abundance,|the apparent availability|of virtually all material necessities|tended to lead people|to expect speedy gratification of their desires|and to have little sense|of the length of time|over which people in other times and places|had had to wait|in order to have|some of their more basic material needs satisfied.','pp041':'Thus|I learned|from life itself.|At the beginning|I was only|a little mass of possibilities.|It was my teacher|who unfolded|and developed them.|When she came,|everything about me|breathed of love and joy|and was full of meaning.|She|has never since let pass|an opportunity|to point out the beauty|that is in everything,|nor has she ceased trying|in thought and action|and example|to make my life|sweet and useful.','pp042':'Men can communicate;|so can the other animals.|But men|can communicate|across the barriers|of time and space,|while the other animals cannot,|for man alone|holds the secret|of the greatest of all inventions:|the written word.|Beside this,|the telephone, the radio, the television|are the toys of children.|Only recently, in fact,|have men conquered,|by means of the spoken word,|any space|larger than that|over which|the natural voice will carry,|whereas|down through the long course of history,|writing|has been of inestimable service|in bringing men and nations|closer together.|We should know|little enough, indeed,|of that very history|if we had to rely|on oral tradition alone.','pp043':'In my experience|the problem of what to do in life|was not made any easier|by those who were in charge of my education.|Looking back,|it seems most odd|that never once|in all the years that I was at school|was there any general discussion|about careers.','pp044':'Historians have described|how life periods became demarcated|in Western societies|over the past centuries.|Only with industrialization|and the appearance of a middle class|and formally organized schools|did childhood become|a clearly definable period of time.','pp045':'So important is the role of the environment|that talking of an innate tendency|to be aggressive|makes little sense for animals,|let alone for humans.|It is as if we were to assert|that because there can be no fires without oxygen,|and because the Earth is blanketed by oxygen,|it is in the nature of our planet|for building to burn down.','pp046':'This state of things|might have lasted|until his working life had ended|in the natural way|had not his employer,|the head of the firm, died|and his son,|a young man with modern ideas|and a determination to increase his business,|come into possession.','pp047':'Such vegetative reproduction|he viewed as a step|towards the rearing of plants|following seeding,|and it was at this intermediate stage|in south-east Asia|that plants such as taro, yam, banana,|breadfruit, and sugarcane evolved.','pp048':'In the 1850s and 1860s|British railway companies|ensured uniform time|at stations|by arranging|for clock manufacturers|to send a man|once a week|from station to station|to ensure|that the clocks|were keeping good time.|At every station|a porter|would be told|to have a ladder ready|and wait|while the clockman ascended,|wound the clock,|and adjusted the hands.|If necessary|the train|would be kept|a minute or two|for him|so that he could do the journey|down the line|in one day.','pp049':'The road user carries|much of the responsibility|for traffic accidents:|the vehicle driver|for the safety of others as well as himself,|the pedestrian|mainly for his own safety,|while the passenger carries|relatively little responsibility.','pp050':'Emotions are everywhere the same,|but the artistic expression of them|varies from age to age|and from one country to another.|We are brought up|to accept the conventions|current in the society|into which we are born.|This sort of art, we learn in childhood,|is meant to excite laughter,|that to provoke our tears.|Such conventions vary with great rapidity,|even in the same country.','tc01':'The view of the world below|from the top of a mountain|surrounding mountains,|the valleys and rivers, the towns,|on a sunny day|is very clear.|We can easily identify|the farms and forest.|The historian|who writes of the distant past|can view that world from the mountain,|although no two historians|would agree completely|on what they see.|But there are no mountain peaks|from which historians of the modern era|can look over the past.|Indeed,|they often feel like|a man lost deep in the forest:|he can see the trees,|but not even the forest as a whole.|Yet, somehow,|historians or political scientists|studying our own age|must try to identify the landmarks|that lead to the present.|They must select|from the countless events of recent history|those which seem the most important|and which provide some clue|to the mysteries of modern history.|For only some understanding of the past|enables us to know|where we are|and provides some paths|through the forests in the future.','tc02':'Television|is helping to change the world.|In the United States, for example,|commercial television|invites everyone|to participate fully|in the benefits|of an industrial and democratic culture|by buying toothpastes and detergents and automobiles,|by taking an interest|in national and international affairs,|by sharing the emotions and dreams|and aspirations and values|that are depicted in the entertainment.|What television communicates to whites,|it also communicates,|perhaps unintentionally, to black people.|There is nothing to be surprised at,|therefore,|in the increased urgency|of black people\'s demands,|not only for better job opportunities,|but for full rights as consumers|to eat, drink, wear, and enjoy.|A revolution|in the patterns and techniques of communication|always has more consequences|than are dreamed of|at the time|the innovations are introduced.|The increased density|of the communication network|in the nation and in the world|resulting from technological advances|means an increased tempo|of social change.','tc03':'There is a great deal of concern today|with the problem of values.|Youth, in almost every country,|is deeply uncertain|of what values to believe;|the values associated with various religions|have lost much of their influence;|educated individuals in every culture|seem unsure and troubled|as to the goals they hold in esteem.|The reasons are not far to seek.|The world culture,|in all its aspects,|seems increasingly scientific and specialized;|and the rigid, absolute views on values|which come to us from the past|appear out of date.|Even more important is the fact|that the modern individual|is met from every angle|by different and opposing value claims.|It is no longer possible|to settle comfortably|into the value system|of one\'s ancestors or one\'s community|and live out one\'s life|without ever examining|the nature and the accepted truths|of that system.','tc04':'It is often possible|to make known|what one wants|and what he is thinking about|by means of gesture,|without the use of words,|and it may be|that men talked by signs|before they used spoken language.|There are many gestures|which are still used to express ideas|and which almost everybody understands.|When one shakes his head|on being asked a question|we understand|that he means No,|just as well|as if he had spoken the word.|Similarly|if he nods in response to a question|we understand that he means Yes.|But besides|these two simple forms|of answering a question|we may express|a great many other ideas by signs.|Putting the first finger to the lips|when someone is talking|means keep quiet|just as clearly|as if these words were spoken aloud.|Holding up both hands|means I surrender.|Shrugging the shoulders|and shaking the head|often means I don\'t know.','tc05':'The dictionary|does more than record.|It also guides,|perhaps nearly dictates.|It informs anyone who uses it|of the meanings|which are generally attached to words,|and therefore informs readers,|especially students,|how they should use the word in future|if they want to make themselves|clearly understood.|Changes,|usually gradual ones,|are taking place the whole time, however,|in the ways in which words are used.|These changes are seldom deliberate,|and may be due|to a failure of education,|to ignorance or stupidity,|but once they have taken place,|once it has become the general practice|to use a word|with a new, slightly changed meaning,|all the editor of the dictionary can do|is to record these changes.','tc06':'When Red Riding Hood|visits her grandmother|she finds|that a wolf|has wrongfully taken|the grandmother\'s place.|The protective, kindly figure|has been replaced|by a dangerous and destructive creature.|It is this exchange of figures|which makes the story|particularly alarming.|To meet a wolf unexpectedly|is frightening enough,|but to find|that one\'s loving grandmother|has turned into this terrifying beast|is to add to the situation|that basic insecurity|which springs from|a sudden loss of trust|in a person upon whom one relies.','tc07':'Thanks to modern machinery,|production|is outrunning consumption.|Organized waste among consumers|is the first condition|of our industrial prosperity.|The sooner a consumer|throws away the object he has bought|and buys another,|the better for the producer.|At the same time, of course,|the producer must do his bit|by producing nothing|but the most perishable articles.|The man who builds a skyscraper|to last for more than forty years|is a traitor to the building trade.|The words are those|of a great American contractor.|Substitute motor car, boot, suit of clothes,|for skyscraper,|and one year, three months, six months,|and so on for forty years,|and you have the gospel|of any leader|of any modern industry.','tc08':'It has been suggested|that possibly technology|has been used as a substitute|for a more equal division of labor|at home.|Many men|would doubtless prefer|to be able to equip their wives|with a super-technology kitchen|rather than share housework themselves,|but this in fact|does not necessarily reduce|the amount of time|women spend there.|In addition,|women do not necessarily|take advantage of time|gained by technology,|or their husband\'s help,|to do things|totally unrelated to housework and childcare.|There is no simple relationship|between the amount of time spent on housework,|and factors|like labor-saving devices|and help from other members of the family.','tc09':'The road user|carries much of the responsibility|for traffic accidents:|the vehicle driver|for the safety of others|as well as himself,|the pedestrian|mainly for his own safety,|while the passenger|carries relatively little responsibility.|Driving is a skill|which requires training,|and, like other skills,|it can be maintained at a high level|only by regular practice.|The time usually required|to train a London bus driver|who has never driven before|is 50 hours at the wheel.|The average private car driver|receives considerably less training|than this|before he drives on his own|and proceeds to acquire experience.|Increasing experience|is a major factor|in accident reduction,|for inexperienced drivers|have high accident rates.|Experience cannot be taught,|but it can be guided.|Studies of training methods|for motor vehicle drivers|have not been undertaken,|but the teaching|of defensive driving techniques|is important.|It may be|that good, i.e., safe, drivers|anticipate|or in some other way avoid|pre-accident situations.','tc10':'The intelligent person,|young or old,|meeting a new situation or problem,|opens himself up to it;|he tries to take in|with mind and senses|everything he can about it;|he thinks about it,|instead of about himself|or what it might cause|to happen to him;|he grapples with it boldly,|imaginatively, resourcefully,|and if not confidently|at least hopefully;|if he fails to master it,|he looks without shame or fear|at his mistakes|and learns what he can from them.|This is intelligence.|Clearly its roots lie|in a certain feeling about life,|and one\'s self|with respect to life.|Just as clearly,|unintelligence is not|what most psychologists seem to suppose,|the same thing as intelligence|but not as much of it.|It is an entirely different style of behavior,|arising out of|an entirely different set of attitudes.','tc11':'He no longer knew|why he had come to the city,|but it was not|for the sake of|the bed-sitting room in Dublin,|the oblong of dusty garden|outside the window,|the trams clanging up and down,|the shelf full of second-hand books,|or the occasional visit to the pictures.|Half humorously,|half despairingly,|he would sometimes clutch his head|in his hands|and admit to himself|that he had no notion|of what he wanted.|He would have liked|to leave it all|and go to Glasgow or New York|as a labourer,|not because he was romantic,|but because he felt|that only when|he had to work with his hands|for a living|and was no longer sure of his bed|would he find out|what all his ideals and emotions meant|and where he could fit them|into the scheme of his life.','tc12':'Man has the ability|to make use of various symbols|as a means of communicating|his thoughts or feelings to others.|Words are no more than|one kind of such symbols.|The use of words in thinking|is very much like|the use of mathematical symbols|in calculation.|So amazing is the function of symbols|that by the use of mathematical symbols,|for instance,|we can solve all sorts of problems|without weighing or counting|actual objects.|The same can be said of words;|that is,|word symbols make it possible|to determine the results|of particular actions|without actually performing them.|To put it in another way,|with the aid of symbols|it becomes possible for the individual|to solve problems|and arrive at results|without going through|the slow and clumsy process|of trial and error.','tc13':'Emotions|are everywhere the same;|but the artistic expression of them|varies from age to age|and from one country to another.|We are brought up|to accept the conventions|current in the society|into which we are born.|This sort of art,|we learn in childhood,|is meant to excite laughter,|that to provoke our tears.|Such conventions|vary with great rapidity,|even in the same country.','tc14':'Those of us who live in towns|have learned to adjust ourselves|to some degree|to the kind of overcrowding|which seems to be|an inevitable consequence of city life;|but, the closer we are packed,|the more easily resentful of each other|do we tend to become.|It is probably on this account|that many people|find life in cities|irritating and exhausting,|since they are compelled|to control aggressive impulses|which arise solely|as a result of overcrowding.|It is also probable|that it is because of the wider spacing|between individuals|which is usual in the countryside|that rural folk|are less tense, more friendly,|and often better mannered|than urban people.','tc15':'Human beings|are talkative creatures|and always have been,|so far as we can see.|It was our urge|to communicate with each other|and growing ability to do so|that was probably the chief factor|in the development|that made us different|from all other animals.|Leading anthropologists|are now of the opinion|that it was not so much aggressiveness|as ability to cooperate|that gave the earliest forms of man|a superiority|over others of the ape family,|and cooperation entails communication.|As far back as 750,000 years ago|some primitive men, or hominids,|had mastered the use of fire.|This signified a great mental advance|for it is natural to all animals|to fear fire.|And only by combining together,|passing on acquired knowledge,|and making plans|could men conquer this fear|and turn what had been cause of terror|to their own advantage.|All this signifies|that already they had language of a sort.','tc16':'Language|is certainly an important factor|in understanding others.|As my Japanese language ability improves,|so does my understanding of people.|This is also true|in learning French,|my major at college.|It was not until|I was fluent in French|that I really got to know|and appreciate French people.|I do not say|this is always the case,|but language does give insights|into a foreign culture|that would not be possible otherwise,|especially in the case of Japanese|who attach much importance|to expressions of politeness and agreement.|Were I not convinced|it is possible|to understand one another|through language,|I would have left Japan long ago.','tc17':'Language,|like other forms of social activity,|has to be appropriate|to the speaker using it.|This is why,|in many communities,|men and women\'s speech is different.|In certain societies,|a man might be laughed to scorn|if he used language|inappropriate to his sex,|just as he would be|if, in our society,|he were to wear a skirt.|This, however,|is only a part of the total picture.|Behaviour|does not only have to be appropriate|to the individual,|it also needs to fit|particular occasions and situations.|There are, for example,|some circumstances|in which a woman who wore a skirt|would also be in danger|of being laughed at.|A woman competing in a running race|or going for a swim in a skirt|would undoubtedly look somewhat odd,|to the point of inviting laughter.|This, too, is true of language.|To give a sports commentary|in the language of the Bible|or a church sermon in legal language|would be either a bad mistake,|or a joke.|Language, in other words,|varies not only|according to the social characteristics|of the speaker|such as his social class, age and sex|but also|according to the social situation|in which he finds himself.|The same speaker|uses different linguistic varieties|in different situations|and for different purposes.|The totality of linguistic varieties|used in this way|and they may be very many|by a particular community of speakers|can be called|that linguistic community\'s verbal repertoire.','tc18':'It is difficult these days|not to believe|that literature and the arts|attract less attention,|and science and technology|more attention,|than a few generations or centuries ago.|One often hears it said,|in Japan and the West,|that young people|are not as well educated|as they used to be.|I am inclined to think|that the matter|should be stated somewhat differently.|It is not|that they acquire less education|than they once did.|It is rather|that the emphasis has changed.|They are not as interested in language|as they once were,|and it may also be|that the educational system|does not work as hard|as it once did|to arouse this interest.','tc19':'Nature|has on the whole been good to man,|but nature also has her angry moods,|when she seems determined|to destroy man|and what he has created.|Swollen rivers|overflowing their banks|and flooding the countryside,|unseasonable frosts and violent storms|destroying crops|before they can be harvested,|plagues wiping out|many thousands of lives;|all these are the unfriendly forces|of nature.|Perhaps the first time|man struck back at nature|was in the dim past|when he decided|to go forth from his cave|and hunt down the tiger|or some other savage animal|that threatened his life.|Today, of course,|the threat of wild beasts|in most parts of the world is not great,|but man is still hunting his enemies.|The hunted beasts|have shrunk very greatly in size.|Among them are the insects.|Still smaller|are the creatures|that can be seen only through microscopes.|Nevertheless,|the danger from the tiny living creatures|is as real to us today|as the danger from the giant fierce beasts|was to early man.','tc20':'Prehistoric man|may well have had|as much brain power|as has the man of today.|Yet modern man|probably makes|more material progress in a year\'s time|than his primitive ancestors|made in thousands of years.|This is possible|because man has developed|his means of communication|to such a degree|that he can learn readily from others|and can preserve his discoveries|for future generations to build upon.|Man\'s greatest invention|was not in the use of mechanics,|or steam, or electricity,|or in taming the forces of the atom.|Far more important|was his finding out|that the noises he makes in his throat|when he wishes to express some emotion|could be developed into a system|which he could use|to communicate complex ideas|to his fellows.','tc21':'What is detestable|in some critics of poetry|is their way of laying down the law|and telling us|which poets we may read|and which we may not.|Our choice of reading|is our own affair|and if we have a genuine feeling for poetry|we are just as likely as they are|to make a good one.|We read the critics|because they have given more time and thought|than we have|to the poets they are discussing|and so can be helpful,|but in the end|our own judgement|is the only one that makes for us.|Poetry exists|to be enjoyed|and not minutely dissected|and if we know too much about a poem|we are likely to enjoy it less.|The best critics|illustrate their points with ample quotations|so that we may judge for ourselves.|But how many good critics of poetry|have there been|in the past fifty years?|At the most a dozen.','tc22':'My own objection to television is|that it gets in the way|of contact with the family.|There is nothing more dispiriting|than to arrive home in the evening|to find the children|sitting in front of the set,|from which they do not move|until bedtime.|It is important|to make time to talk to children|and to listen to them.|But it is a good thing, too,|if children are encouraged to choose.|There is not much to be gained|from looking in continuously,|but there is every reason|for letting children decide|which programmes they most want to watch|and have the television on for those.|Perhaps my attitude to television|is the rather puritanical one|that most people,|and especially children,|should have something better to do|than watch it very much.','tc23':'During the early days|of man\'s existence,|life was simple|and his pictures, music and other works of art|were also simple.|As his world|grew more and more complex,|his art changed in the same way.|To be sure,|some painters today|still give us pictures|that are simple and easy|to understand and enjoy.|Many others, however,|are attempting to express things|about our inner feeling and moods|which cannot be told in words,|or even in pictures|like any that have ever been painted before.|Art is always a reflection.|The art of every century|is a mirror|in which we catch glimpses|of the life of that century.|The art of yesterday|can no more express our life of today|than can the cave or mud hut|fit our modern housing needs.|This does not necessarily mean|that the art of other peoples|was not often just as beautiful and fine|as any we can produce today.|Neither does it mean|that the artist of one period|cannot learn from the past.|In art,|each new generation|makes use of the knowledge and skills|of the one before,|changing these|to fit its own needs.','tc24':'There is no greater obstacle|to the enjoyment|of great works of art|than our unwillingness|to discard habits and prejudices.|A painting|which represents a familiar subject|in an unexpected way|is often condemned|for no better reason|than that it does not seem right.|The more often|we have seen a story|represented in art,|the more firmly|do we become convinced|that it must always be represented|on similar lines.|Though we all know|that the Bible tells us nothing|about the appearances of Jesus,|and that God Himself|cannot be visualized in human form,|and though we know|that it was the artists of the past|who first created the images|we have become used to,|some are still inclined to think|that to depart|from these traditional forms|amounts to blasphemy.'};

  ttsUtterance.onend=function(){ttsPlaying=false;var b=document.getElementById('pbtn');if(b)b.textContent='\u25b6'};

}

function calcStreak(){var a=getAct().sort(),today=new Date().toISOString().slice(0,10),cur=0,max=0,run=0;if(a.length===0)return{cur:0,max:0};for(var i=a.length-1;i>=0;i--){var d=a[i];if(i===a.length-1){if(d===today||d===yest(today)){run=1}else break}else{var prev=a[i+1];if(diffDays(d,prev)===1)run++;else break}}cur=run;run=1;for(var i=1;i<a.length;i++){if(diffDays(a[i-1],a[i])===1)run++;else run=1;if(run>max)max=run}if(cur>max)max=cur;return{cur:cur,max:max}}
function yest(s){var d=new Date(s);d.setDate(d.getDate()-1);return d.toISOString().slice(0,10)}
function diffDays(a,b){return Math.round((new Date(b)-new Date(a))/86400000)}

if(items.length===0){h+='<p class="empty">教材がまだありません</p>'}else{items.forEach(function(m,idx){var _isChallenge=m.title.indexOf('C')===0;var _isHard=PP_HARD.indexOf(m.id)>=0;var _showDagger=_isChallenge||_isHard;h+='<div class="mat-item" style="border-left:3px solid '+catColor(ci)+';background:color-mix(in srgb, '+catColor(ci)+' 6%, var(--surface))" onclick="showDetail(\''+m.id+'\')"><div class="mat-badge" style="background:'+catColor(ci)+'">'+(idx<9?'0':'')+(idx+1)+'</div><div class="mat-title">'+(_showDagger?DAGGER_SVG:'')+m.title+(getDiff(m.id)==='hard'?' &#9889;':'')+(getDiff(m.id)==='easy'?' &#9989;':'')+'</div>'+(m.isLearned?'<span class="mat-learned" style="background:color-mix(in srgb, var(--accent) 15%, transparent);color:var(--accent)">学習済み</span>':'')+'<span class="mat-chevron">›</span></div>'})}
scr(h);showTabs(true);setTabs(0)}

function showDetail(id){var _same=curId===id;curScreen='detail';curId=id;if(!_same)stopAudio();var m=ld().find(function(x){return x.id===id});if(!m){showHome();return}var ci=CATS.findIndex(function(c){return c.id===m.categoryId}),cat=CATS[ci];
hdr('<div class="back-row"><button class="back-btn" onclick="showList(\''+m.categoryId+'\')">← 戻る</button><span class="header-title">'+m.title+'</span></div><div class="toggle" onclick="toggleTheme();showDetail(\''+id+'\')"><div class="toggle-knob"></div></div>');
var h='<div class="detail-tag">'+cat.label+'</div>';
h+='<div class="mode-toggle"><button class="mode-btn'+(viewMode==='both'?' active':'')+'" onclick="setMode(\x27both\x27,\x27'+id+'\x27)">英文+日本語</button><button class="mode-btn'+(viewMode==='ja'?' active':'')+'" onclick="setMode(\x27ja\x27,\x27'+id+'\x27)">日本語のみ</button></div>';
var _chunkData=CHUNKS[m.id];var _chunks=[];if(_chunkData){var _parts=_chunkData.split('|');_parts.forEach(function(p,i){_chunks.push('<span id="c'+i+'">'+p+'</span>')});}else{_chunks.push('<span id="c0">'+m.englishText+'</span>');}var _numChunks=_chunks.length;if(viewMode!=='ja'){h+='<p class="en-text" id="en-words">'+_chunks.join(' ')+'</p>';}
if(viewMode==='ja'){var _jtext=m.japaneseText,_jsplits=_jtext.split(/(?<=[、。！？，])/g).filter(function(x){return x.length>0}),_jchunks=[],_jbuf='';_jsplits.forEach(function(p,pi){_jbuf+=p;if(_jbuf.length>=8||pi===_jsplits.length-1){_jchunks.push('<span id="j'+(_jchunks.length)+'">'+_jbuf+'</span>');_jbuf=''}});h+='<p class="ja-text" id="ja-words" style="font-size:19px;line-height:1.85;color:var(--text)">'+_jchunks.join('')+'</p>';}else{h+='<p class="ja-text">'+m.japaneseText+'</p>';}
if(m.audioFile){h+='<div class="audio-card"><div class="audio-row"><button class="play-btn" style="width:38px;height:38px;font-size:13px;margin-right:6px" onclick="navRestart()">⏮</button><button class="play-btn" id="pbtn" onclick="togglePlay(\''+m.audioFile+'\')">▶</button><button class="play-btn" style="width:38px;height:38px;font-size:13px;margin-left:6px" onclick="navNext()">⏭</button><div class="play-label" style="flex:1;text-align:center;color:var(--textSoft);font-size:13px">再生中</div></div><div><input type="range" class="seek-bar" id="seekbar" min="0" max="1000" value="0" oninput="seekTo(this.value)"></div><div class="time-speed"><span class="time-label" id="tl">0:00 / 0:00</span><div class="speed-row">';[0.8,1.0,1.2,1.5,2.0].forEach(function(s){h+='<button class="speed-chip'+(curSpeed===s?' active':'')+'" onclick="setSpeed('+s+')">'+s.toFixed(1)+'</button>'});h+='</div></div><div class="mode-ctrl-row"><button class="mode-ctrl-btn'+(repeatMode?' active':'')+'" onclick="toggleRepeat()">&#128257; リピート</button><button class="mode-ctrl-btn'+(autoMode?' active':'')+'" onclick="toggleAuto()">&#9654;&#9654; 自動再生</button></div></div>'}else{h+='<div class="audio-card"><p class="no-audio">音声が未設定です</p></div>'}
h+='<div class="vocab-section"><div class="vocab-title">VOCABULARY</div><div id="vocab-list"></div><div class="vocab-add-row"><input class="vocab-input" id="vi-w" placeholder="英単語"><input class="vocab-input" id="vi-m" placeholder="意味"><button class="vocab-add-btn" onclick="addVocabClick()">+</button></div></div>';h+='<div class="diff-row">';h+='<button class="diff-btn'+(getDiff(m.id)==='hard'?' active-hard':'')+'" data-id="'+m.id+'" data-lv="hard" onclick="setDiff(this.dataset.id,this.dataset.lv)">&#9889; 難しい</button>';h+='<button class="diff-btn'+(getDiff(m.id)==='easy'?' active-easy':'')+'" data-id="'+m.id+'" data-lv="easy" onclick="setDiff(this.dataset.id,this.dataset.lv)">&#9989; いける</button>';h+='</div>';h+='<button class="learned-btn '+(m.isLearned?'on':'off')+'" onclick="toggleLearned(\''+id+'\')">'+(m.isLearned?'学習済み ✓':'学習済みにする')+'</button>';
h+='<div class="detail-spacer"></div>';scr(h);renderVocab();showTabs(false)}

function showAdd(){curScreen='add';stopAudio();
hdr('<div class="back-row"><button class="back-btn" onclick="showList(\''+curCat+'\')">← 戻る</button><span class="header-title">教材を追加</span></div><div class="toggle" onclick="toggleTheme();showAdd()"><div class="toggle-knob"></div></div>');
scr('<div class="form-label">タイトル</div><input class="form-input" id="af-t" placeholder="例: 013"><div class="form-label">英文</div><textarea class="form-input" id="af-e" placeholder="英文を入力"></textarea><div class="form-label">日本語訳</div><textarea class="form-input" id="af-j" placeholder="日本語訳を入力"></textarea><div class="form-label">音声ファイル名</div><input class="form-input" id="af-a" placeholder="例: 013.wav"><button class="save-btn" onclick="saveNew()">保存</button>');
showTabs(false)}
// Audio
function toggleRepeat(){repeatMode=!repeatMode;if(repeatMode)autoMode=false;var btns=document.querySelectorAll('.mode-ctrl-btn');if(btns[0])btns[0].className='mode-ctrl-btn'+(repeatMode?' active':'');if(btns[1])btns[1].className='mode-ctrl-btn'+(autoMode?' active':'')}
function toggleAuto(){autoMode=!autoMode;if(autoMode)repeatMode=false;var btns=document.querySelectorAll('.mode-ctrl-btn');if(btns[0])btns[0].className='mode-ctrl-btn'+(repeatMode?' active':'');if(btns[1])btns[1].className='mode-ctrl-btn'+(autoMode?' active':'')}

function getAdjacentMaterial(dir){
  var d=ld();
  var cur=d.find(function(x){return x.id===curId});
  if(!cur)return null;
  var cat=d.filter(function(x){return x.categoryId===cur.categoryId});
  var idx=cat.findIndex(function(x){return x.id===cur.id});
  var next=cat[idx+dir];
  return next||null;
}
function navRestart(){
  if(ap.currentTime<0.3){
    var prev=getAdjacentMaterial(-1);
    if(prev){stopAudio();showDetail(prev.id);setTimeout(function(){if(prev.audioFile)togglePlay(prev.audioFile)},300);}
    else{ap.currentTime=0;seekTo(0);}
  }else{
    ap.currentTime=0;seekTo(0);
  }
}
function navNext(){
  var next=getAdjacentMaterial(1);
  if(next){stopAudio();showDetail(next.id);setTimeout(function(){if(next.audioFile)togglePlay(next.audioFile)},300);}
}
function seekTo(val){if(ap.duration){ap.currentTime=ap.duration*val/1000}}
function togglePlay(f){if(audioFile!==f){ap.src='audio/'+f;ap.playbackRate=curSpeed;audioFile=f}if(ap.paused){ap.play();document.getElementById('pbtn').textContent='❚❚'}else{ap.pause();document.getElementById('pbtn').textContent='▶'}}
function setSpeed(s){curSpeed=s;ap.playbackRate=s;document.querySelectorAll('.speed-chip').forEach(function(c){c.classList.toggle('active',parseFloat(c.textContent)===s)})}
function stopAudio(){ap.pause();ap.currentTime=0;audioFile='';document.querySelectorAll('.word-hl').forEach(function(s){s.classList.remove('word-hl')});document.querySelectorAll('.ja-hl').forEach(function(s){s.classList.remove('ja-hl')});document.querySelectorAll('.ja-hl').forEach(function(s){s.classList.remove('ja-hl')})}
function seekWave(e){if(!ap.duration)return;var r=e.currentTarget.getBoundingClientRect();var p=(e.clientX-r.left)/r.width;ap.currentTime=p*ap.duration}
function fmtTime(s){if(!isFinite(s))s=0;var m=Math.floor(s/60),sec=Math.floor(s%60);return m+':'+String(sec).padStart(2,'0')}
ap.addEventListener('timeupdate',function(){if(curScreen!=='detail')return;var tl=document.getElementById('tl');if(tl)tl.textContent=fmtTime(ap.currentTime)+' / '+fmtTime(ap.duration);var sb=document.getElementById('seekbar');if(sb&&ap.duration){sb.value=Math.floor(ap.currentTime/ap.duration*1000)}var ep=document.getElementById('en-words');if(ep&&ap.duration){var echunks=ep.querySelectorAll('span[id^="c"]');if(echunks.length){var ewcs=[],etw=0;echunks.forEach(function(s){var wc=s.textContent.replace(/\s/g,'').length;ewcs.push(wc);etw+=wc});var epct=Math.min(1,(ap.currentTime+0.3)/ap.duration),ecum=0,eci=0;for(var i=0;i<ewcs.length;i++){ecum+=ewcs[i]/etw;if(epct<ecum){eci=i;break}if(i===ewcs.length-1)eci=i}echunks.forEach(function(s,i){s.classList.toggle('word-hl',i===eci)})}}if(viewMode==='ja'){var jp=document.getElementById('ja-words');if(jp&&ap.duration){var jchunks=jp.querySelectorAll('span[id^="j"]');if(jchunks.length){var jwcs=[],jtw=0;jchunks.forEach(function(s){jwcs.push(s.textContent.length);jtw+=s.textContent.length});var jpct=Math.min(1,(ap.currentTime+0.3)/ap.duration),jcum=0,jci=0;for(var ji=0;ji<jwcs.length;ji++){jcum+=jwcs[ji]/jtw;if(jpct<jcum){jci=ji;break}if(ji===jwcs.length-1)jci=ji}jchunks.forEach(function(s,i){if(i===jci){s.classList.add('ja-hl')}else{s.classList.remove('ja-hl')}})}}}});
ap.addEventListener('ended',function(){var b=document.getElementById('pbtn');if(b)b.textContent='▶';if(repeatMode&&audioFile){ap.currentTime=0;ap.play();if(b)b.textContent='❚❚';}else if(autoMode){var d=ld();var cur=d.find(function(x){return x.audioFile&&audioFile.endsWith(x.audioFile)});if(cur){var cat=d.filter(function(x){return x.categoryId===cur.categoryId});var idx=cat.findIndex(function(x){return x.id===cur.id});if(idx>=0&&idx<cat.length-1){var next=cat[idx+1];if(next.audioFile){showDetail(next.id);setTimeout(function(){togglePlay(next.audioFile)},500);}}}}});
// Actions

function getVocab(id){var base=VOCAB[id]||[];var del=[];try{del=JSON.parse(localStorage.getItem('mf_vdel_'+id)||'[]')}catch(e){}var kept=[];for(var i=0;i<base.length;i++){if(del.indexOf(i)<0)kept.push({w:base[i].w,m:base[i].m,_src:'base',_idx:i})}var usr=[];try{usr=JSON.parse(localStorage.getItem('mf_vocab_'+id)||'[]')}catch(e){}for(var j=0;j<usr.length;j++){kept.push({w:usr[j].w,m:usr[j].m,_src:'user',_idx:j})}return kept}
function renderVocab(){var el=document.getElementById('vocab-list');if(!el)return;var voc=getVocab(curId);var h='';if(voc.length>0){voc.forEach(function(v){h+='<div class=\'vocab-item\'><span class=\'vocab-word\'>'+v.w+'</span><span class=\'vocab-mean\'>'+v.m+'</span><button class=\'vocab-del\' data-src=\''+v._src+'\' data-idx=\''+v._idx+'\' onclick=\'event.stopPropagation();delVocabClick(this)\'>x</button></div>'})}else{h='<div style=\'color:var(--textSoft);font-size:13px\'>単語なし</div>'}el.innerHTML=h}
function addVocabClick(){var w=document.getElementById('vi-w').value.trim();var m=document.getElementById('vi-m').value.trim();if(!w||!m){alert('英単語と意味を両方入力してください');return}var usr=[];try{usr=JSON.parse(localStorage.getItem('mf_vocab_'+curId)||'[]')}catch(e){}usr.push({w:w,m:m});localStorage.setItem('mf_vocab_'+curId,JSON.stringify(usr));document.getElementById('vi-w').value='';document.getElementById('vi-m').value='';renderVocab()}
function delVocabClick(btn){if(!confirm('この単語を削除しますか？'))return;var src=btn.dataset.src;var idx=parseInt(btn.dataset.idx);if(src==='user'){var usr=[];try{usr=JSON.parse(localStorage.getItem('mf_vocab_'+curId)||'[]')}catch(e){}usr.splice(idx,1);localStorage.setItem('mf_vocab_'+curId,JSON.stringify(usr))}else{var del=[];try{del=JSON.parse(localStorage.getItem('mf_vdel_'+curId)||'[]')}catch(e){}del.push(idx);localStorage.setItem('mf_vdel_'+curId,JSON.stringify(del))}renderVocab()}
function getDiff(id){try{var d=JSON.parse(localStorage.getItem('mf_diff')||'{}');return d[id]||null}catch(e){return null}}
function setDiff(id,lv){var d=JSON.parse(localStorage.getItem('mf_diff')||'{}');if(d[id]===lv){delete d[id]}else{d[id]=lv}localStorage.setItem('mf_diff',JSON.stringify(d));var btns=document.querySelectorAll('.diff-btn');if(btns.length>=2){btns[0].className='diff-btn'+(getDiff(id)==='hard'?' active-hard':'');btns[1].className='diff-btn'+(getDiff(id)==='easy'?' active-easy':'')}}
function setMode(mode,id){viewMode=mode;showDetail(id)}
function toggleLearned(id){var d=ld(),m=d.find(function(x){return x.id===id});if(m){m.isLearned=!m.isLearned;sv(d);logAct();showDetail(id)}}
function saveNew(){var t=document.getElementById('af-t').value.trim(),e=document.getElementById('af-e').value.trim(),j=document.getElementById('af-j').value.trim(),a=document.getElementById('af-a').value.trim();if(!t||!e||!j){alert('タイトル・英文・日本語訳をすべて入力してください。');return}var d=ld();d.push({id:curCat+'_'+Date.now(),categoryId:curCat,title:t,englishText:e,japaneseText:j,audioFile:a||null,isLearned:false});sv(d);showList(curCat)}
logAct();showHome();var _swX=0,_swY=0;document.addEventListener('touchstart',function(e){_swX=e.touches[0].clientX;_swY=e.touches[0].clientY},{passive:true});document.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-_swX;var dy=Math.abs(e.changedTouches[0].clientY-_swY);if(dy<60&&((dx>60&&_swX<30)||(dx<-60&&_swX>window.innerWidth-30))){if(curScreen==='detail'&&curCat)showList(curCat);else if(curScreen==='list')showHome();}},{passive:true});
</script>
