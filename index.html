{id:'t001',c:'toushizu',t:'001',e:'In his search for more comfortable living, modern man sometimes makes for his fellow men and even for himself an environment which turns out to be potentially harmful to health.',j:'より快適な生活を求める中で、現代人は、同時代の人に対してもまた自分たち自身に対しても、健康を害する可能性のある環境を時として作り出すことがある。',a:'001.wav'},
{id:'t002',c:'toushizu',t:'002',e:'Many people seem to have built their lives around the notion that they are in some way indispensable to children, and to question this is to attack the very center of their being.',j:'多くの人たちは、自分が何らかの点で、子供にとってはなくてはならないものだという考え方を中心に自分の人生を築きあげてきたように思われる。したがって、この考えに異議を唱えることは、彼らの存在のまさに核心を攻撃することなのである。',a:'002.wav'},
{id:'t003',c:'toushizu',t:'003',e:'I heartily wish that in my youth I had had someone of good sense to direct my reading. I sigh when I reflect on the amount of time I had wasted on books that were of no great profit to me. What little guidance I had I owe to a young man who came to live with my family in Heidelberg.',j:'若いころ、私の指導をしてくれる、誰か良識のある人がいてくれたなら、と心から思う。自分にとって、あまり役に立たなかった本に費やしてきた時間のことを考えると、ため息が出る。私が受けたささやかな読書指導はみな、ハイデルベルグで私の家族と住むようになった青年によるものである。',a:'003.wav'},
{id:'t004',c:'toushizu',t:'004',e:"Change in the whole social system is inevitable not merely because conditions change but because people themselves change. We change as the years go on. New feelings arise in us, old values depreciate, new values arise. Things we thought we wanted most intensely we realize we don't care about. The things we built our lives on crumble and disappear, and the process is painful.",j:'社会制度全体における変化が避けがたいのは、単に状況が変化するためだけではなく、人間自身が変化するためでもある。年月が経つにつれ、私たちは変化するのである。私たちの中に新しい感情が生じ、古い価値観は下落し、新しい価値観が生じる。自分がいちばん強く望んでいると思ったものを、今は何とも思っていないことを私たちは知る。自分の生活を築いてきた土台は崩壊し、姿を消してゆくのであり、その過程は痛ましいものである。',a:'004.wav'},
{id:'t005',c:'toushizu',t:'005',e:'Science is based on careful observation and experiment by which scientists can construct theories that connect different experiences. They seek regularities in the workings of nature which hopefully reveal the fundamental laws that govern the behavior of matter and forces. Central to this approach is the willingness of the scientist to abandon a theory if evidence is produced against it.',j:'科学は、注意深い観察と実験に基づいており、そのような観察と実験によって、科学者は様々な経験を結びつける理論を構築できる。彼らは自然の働きの中に規則的なものを求め、その規則的なものが物質ともろもろの力の作用を支配する基本的な法則を明らかにすることが望まれている。こういった研究方法の中心をなすのは、ある理論に反する証拠がもたらされると科学者はその理論をためらいもなく捨てるという姿勢なのである。',a:'005.wav'},
{id:'t006',c:'toushizu',t:'006',e:'Strange to say, technology, although of course the product of man, tends to develop by its own laws and principles, and these are very different from those of all natural things. Nature always, so to speak, knows where and when to stop. Greater than the mystery of natural growth is the mystery of the natural stopping of growth.',j:'奇妙な話だが、科学技術は言うまでもなく人間が作り出したものでありながら、独自の法則と原理にしたがって発達する傾向があり、この法則と原理は自然界のすべての事物が持っている法則と原理とは著しく異なっている。自然はいわば、いつどこで止まればよいのかがつねにわかっているのだ。自然に成長することよりもはるかに不可解なのは、成長が自然に停止することなのである。',a:'006.wav'},
{id:'t007',c:'toushizu',t:'007',e:'Agriculture was a step in human progress to which subsequently there was nothing comparable until our own machine age. Agriculture made possible an immense increase in the number of the human species in the regions where it could be successfully practiced.',j:'農業は、人間の進歩の中で、それ以降現代の機械時代に至るまで、それに匹敵するものがないような前進であった。農業は、それがうまく実践できる地域の人口の著しい増加を可能にしたのである。',a:'007.wav'},
{id:'t008',c:'toushizu',t:'008',e:'I think it extremely dangerous, so far as Western civilized communities are concerned, to imagine that there are better systems than democracy. It is not so much that democracy is positively good as that it makes impossible certain great evils which are apt to exist under other systems.',j:'私は、西洋文明社会に関する限り、民主主義よりも優れた制度があると考えるのはきわめて危険だと思う。民主主義が明らかに優れているからというより、むしろ民主主義以外の制度のもとでありがちなある種の害悪が、民主主義のもとではありえないものとなるからだ。',a:'008.wav'},
{id:'t009',c:'toushizu',t:'009',e:'A general disarmament scheme, to be successful, must deprive each nation of the ability to inflict a catastrophic blow on the other; at the least, it must not given an advantage to either side.',j:'全般的な軍縮計画が、うまく行くためには、いずれの国からも、相手国に対して破滅をもたらすほどの打撃を与える能力を奪う必要がある。少なくとも、どちらの側も有利になってはいけない。',a:'009.wav'},
{id:'t010',c:'toushizu',t:'010',e:'The actions of men were said to be governed by the faculty of reason, those of animals by the faculty of instinct, and this attribution of the action of animals to instinct seems to have disguised from most of those who used the word the need for further study or explanation of them.',j:'人間の行動は、理性の働きによって支配され、動物の行動は本能の働きによって支配されていると言われてきた。そして動物の行動をこのように本能のせいにしたことが、本能というその言葉を用いた人々のほとんどから、動物の行動についてのさらなる研究や説明の必要性を隠してきたように思われる。',a:'010.wav'},
{id:'t011',c:'toushizu',t:'011',e:'The great development of electrical signaling devices and the vast improvements which have taken place during the past century in the means of transportation have reduced to comparative insignificance the time element in communication.',j:'電信装置の大きな発展と、過去1世紀の輸送手段のたいへんな進歩が、コミュニケーションにおける時間という要素を比較的重要でないものにした。',a:'011.wav'},
{id:'t012',c:'toushizu',t:'012',e:'The revivals of memory are rarely literal. We naturally remember what interests us. The past is recalled not because of itself but because of what it adds to the present.',j:'記憶の再生が、正確に行なわれることはめったにない。われわれは当然われわれの関心を引くものを思い出す。過去は、それ自体のために思い出されるのではなくて、過去から現在に付与されるものがあるから思い出されるのである。',a:'012.wav'},
{id:'t013',c:'toushizu',t:'013',e:"French parents do their best to develop the child's intelligence as rapidly as possible. They have little patience with childish ideas even if they do not go so far as to look upon childhood as an unfortunate but necessary prelude to adult life.",j:'フランス人の親たちは、子供の知能をできるだけ早く発達させるように最善をつくす。彼らは子供時代を、大人の生活に先立つ不幸ではあるが必要な期間だと見なすほどではないにせよ、子供じみた考えにはほとんど我慢がならないのである。',a:'013.wav'},
{id:'t014',c:'toushizu',t:'014',e:'Man is a history-making creature who can neither repeat his past nor leave it behind; at every moment he adds to and thereby modifies everything that had previously happened to him.',j:'人間は歴史を作り出す生き物であり、自分の過去をくり返すことも、その過去をあとに残しておくこともできない。常に人間は、以前自分の身にふりかかったすべてのことを増やし、そうすることによりそれを変えてゆくのである。',a:'014.wav'},
{id:'t015',c:'toushizu',t:'015',e:'We can view utterances as acts of various kinds and the exchanges of utterances that we call conversations as exchanges of acts.',j:'われわれは、発話をさまざまな種類の行為であるとみなし、そして会話と呼ばれる発話の交換を行為の交換とみなすことができる。',a:'015.wav'},
{id:'t016',c:'toushizu',t:'016',e:'To think that physical comfort makes for human relations is an error we make because the absence of all comfort interferes with good relations. But we base it on the correct observation that when a parent takes pleasure in going out of his way to provide comfort for his child, the child takes it as a proof that he is loveable and deserves care and respect.',j:'安らぎが全くないと正しい人間関係を妨げることになるからといって、肉体的な安らぎが人間関係を促進すると考えるのは、われわれが陥るあやまった考え方である。しかし、われわれがそう考えるのは、親が無理をしてまで子供に安らぎを与えることに喜びを見出すと、子供はそのことを、自分は愛すべき子供であり、世話と尊重に値する子供である証明だと考えるという正しい観察に基づいている。',a:'016.wav'},
{id:'t017',c:'toushizu',t:'017',e:'It was by learning that we ceased to be animals and made ourselves into men. That was the first stage. It was then, far back in the warm jungles, that the wonderful human brain was gradually formed, and with it our fantastically intricate speech and our ingenious adaptable hands.',j:'われわれが動物をやめ人間になったのは、学習によってである。これが第一段階である。その後、素晴らしい人間の頭脳が徐々に形成され、それとともに、素晴らしくこみ入った言語と、精巧な順応性のある手が徐々に形成されたのは、暖かいジャングルの奥地であった。',a:'017.wav'},
{id:'t018',c:'toushizu',t:'018',e:'Literary critics blame journalism for not being literary enough, historians for lacking historical accuracy, lawyers for not arranging facts by the rules of evidence. But journalism is not literature, not history, not law.',j:'文芸評論家はジャーナリズムを十分に文学的ではないと非難し、歴史家はそれを歴史的に正確でないと非難し、法律家はそれを証拠の規則によって事実を配列していないということで非難する。しかしジャーナリズムは文学でも、歴史でも、法律でもないのだ。',a:'018.wav'},
{id:'t019',c:'toushizu',t:'019',e:'Now, there is no doubt that in a modern society there is not enough meaningful work to make it possible for most people to derive the meaning in their lives from the work they do to earn a living. For it is a peculiarity of a modern society that the existence of millions depends on being paid for doing what seems like nothing when done.',j:'いまや、疑いもなく、現代社会においては、たいていの人々が生計を立てるためにする仕事から自分の生活における意味を引き出すことができるに足るだけの意義のある仕事というものはない。というのは、何百万という人々の生活は、なされた時に何の意義もないように思えることをすることに対して支払われる報酬に依存しているのが、現代社会の特質だからである。',a:'019.wav'},
{id:'t020',c:'toushizu',t:'020',e:'It is unusual now for a father to work at home, and his children rarely, if ever, see him at his place of work.',j:'父親が家で働くことは、今日では珍しいことで、子供が仕事場で父の姿を見るのは、たとえあっても、めったにないことである。',a:'020.wav'},
{id:'t021',c:'toushizu',t:'021',e:'We are children only once, and then only for a few short years. But these are the most impressionable years of a lifetime. Never again will the world and everything in it be so excitingly new, so filled with wonder. Never again will physical, mental, spiritual growth be so natural and unavoidable.',j:'私たちは、ただ一度、しかもほんの短い年月しか子供でいることはできない。しかし、こういった子供時代は生涯の中で一番感動を受けやすい時である。子供時代ほど、世界とその中にあるあらゆるものが人を興奮させるほど新しく、驚異に満ちていることは、二度とないだろう。肉体的、知的、精神的成長がこれほど自然で不可避のものであることは、二度とないだろう。',a:'021.wav'},
{id:'t022',c:'toushizu',t:'022',e:'Only after considerable public debate did towns in Great Britain adopt Greenwich time. Many were reluctant to do so but by 1855 ninety-eight percent of public clocks were set to Greenwich time.',j:'かなりの公の場での討議を経たあとでようやく、イギリスの町は、グリニッジ標準時を採用した。採用をためらう町も多かったが、1855年までには、公共の場所にある時計の98%までがグリニッジ標準時に合わされるようになった。',a:'022.wav'},
{id:'t023',c:'toushizu',t:'023',e:'So intimate is the relation between a language and the people who speak it that the two can scarcely be thought of apart. A language lives only so long as there are people who speak it and use it as their native tongue, and its greatness is only that given to it by these people.',j:'言語とその言語を話す人々との関係は、きわめて密接なものなので、両者を切り離して考えることはほとんどできない。言語は、母語としてそれを話し用いる人がいさえすれば、存続するのであり、その言語の偉大さは、こういった人々によって与えられる偉大さにほかならない。',a:'023.wav'},
{id:'t024',c:'toushizu',t:'024',e:'A four-year-old girl became devoted to a bird book with large colored pictures which someone lent her. This became her inseparable companion, and she preferred it to all other books. By the time she was out of the house again she could name correctly every bird in the book, and so could the weary adults who had read it to her, over and over.',j:'4歳になる女の子は、誰かが貸してくれた、大きなカラー写真が入った鳥の本に夢中になった。この本は彼女の親友となり、彼女は他のあらゆる本よりもこの本が好きだった。再び彼女が家から出られるようになるまでには、この本に出てくる鳥の名前をすべて正しく言うことができたし、また、同じように彼女にこの本を繰り返し読んでやってうんざりしている大人たちも、正しく言うことができたのである。',a:'024.wav'},
{id:'t025',c:'toushizu',t:'025',e:'Our answer to the evils of technology is more and better technology. If rivers are becoming polluted, the solution is, we reason today, to develop stronger, and therefore costlier, antipollutants.',j:'科学技術の害悪に対するわれわれの解答は、もっと多くのより優れた科学技術である。もし河川が汚染されつつあるのであれば、その解決策はもっと強力で、従って、より高価な汚染防止装置を開発することだと、今日、われわれは考えているのだ。',a:'025.wav'},
{id:'t026',c:'toushizu',t:'026',e:'The ordinary man will never be rid of the fallacy that words obey thought, that one thinks first and phrases afterward. There must first, it is true, be the intention, the desire to utter something, but the idea does not take shape until it is phrased.',j:'普通の人間は、言葉は思想に従う、つまり、最初にものを考えて、その後で言葉で表現するのだという誤った考えをなくすことは決してないだろう。なるほど、何かを言いたいという意志や欲求が最初にあるに違いないが、その考えは、言葉で表現されるまで形にならないのである。',a:'026.wav'},
{id:'t027',c:'toushizu',t:'027',e:'It is only quite recently in human history that it has come to be fairly widely accepted that all human beings are fundamentally alike; that they share the same basic interests.',j:'すべての人間が根本的に似ていること、つまり彼らが同じ基本的な関心を共有していることがかなり広範に受け入れられるようになったのは、人間の歴史においてほんのごく最近のことである。',a:'027.wav'},
{id:'t028',c:'toushizu',t:'028',e:'Strange to say, of all the irrational fears undoubtedly the strongest and most common one is the fear of speaking in public. Why is it that the simple act of standing in front of a group of people and talking to them for a few minutes should produce such astonishing physical reactions?',j:'奇妙なことだが、あらゆる不合理な不安の中で最も強く、また最もよくみられるものは、疑いなく、人前で話をする不安である。一群の人々の前に立ち、彼らに向かって2、3分間話をするという単純な行為が、あのように驚くべき身体的反応を生み出すのは一体なぜなのだろうか。',a:'028.wav'},
{id:'t029',c:'toushizu',t:'029',e:'If you are indecisive and plan to do something about it, you can take immediate comfort in the fact that indecision is not necessarily due to ignorance and slow thinking. On the contrary it is often thinking of so many things and consideration of so many doubts that result in the difficulty to reach and act on a simple decision.',j:'もしあなたが決断力に乏しく、それについてなんとかしたいと思っているのであったら、決断力が乏しいのは必ずしも無知や思考ののろさのせいではないという事実を知ればすぐに慰めがつくだろう。それどころか、単純な決定に達しそれに基づいて行動することが困難になるのは、多くのことを考えすぎ、あまりに多くの疑問点を考慮する結果であることが多い。',a:'029.wav'},
{id:'t030',c:'toushizu',t:'030',e:'Friendship is above reason, for, though you find virtues in a friend, he was your friend before you found them. It is a gift that we offer because we must; to give it as the reward of virtue would be to set a price upon it, and those who do that have no friendship to give.',j:'友情は、理屈では割り切れない。というのも、ある友人の中に美点を見いだすとしても、それを見いだす前に、その人物はすでに自分の友人だったからである。友情とは、与えずにはいられないから与える贈り物なのである。美点の報酬として友情を与えるのだとすれば、友情に値段をつけることになるだろうし、そんなことをする人は、そもそも与えるべき友情など持っていないのである。',a:'030.wav'},
{id:'t031',c:'toushizu',t:'031',e:'We realize that humans could not have become thinkers had they not at the same time been makers. Humans made tools, but tools also helped make humans the adaptive and flexible creatures they have become.',j:'ものを作る存在でなかったとしたら、人間は考える存在になることはできなかっただろうということを、我々は知っている。人間は道具を作った。しかしまた道具があったからこそ、人間は今あるような適応力があり柔軟性に富んだ生物になったのだ。',a:'031.wav'},
{id:'t032',c:'toushizu',t:'032',e:'Many college teachers do not call a roll or enforce attendance at their lectures, but you would be unwise to conclude from this that you need not go to them, and even more unwise to conclude that you can stay away from practical classes and seminars.',j:'大学の教師の中には自分の講義で出席をとらなかったり、また出席を強要しなかったりする教師が多いが、このことから、講義に出る必要がないと結論づけるならば、それは賢明なことではないだろうし、また、実際に役に立つ授業やゼミに欠席してもよいと結論づけるなら、なおさら愚かなことであるだろう。',a:'032.wav'},
{id:'t033',c:'toushizu',t:'033',e:'Athletes do not perform or compete in social vacuums. One could even argue that modern athletics would not exist without audiences and sport fans. How many athletes would continue to train and compete if no spectators were present in athletic event? Probably none.',j:'運動選手は社会から孤立した状態で演ずることはないし、また競い合うこともない。現代の運動競技は、観衆やファンがいなければ、存在しないだろうと主張することさえできるだろう。もし、競技会に観客が一人もいなければ、一体、何人の選手が練習や競争をし続けるであろうか。おそらく一人もいないだろう。',a:'033.wav'},
{id:'t034',c:'toushizu',t:'034',e:'Most people, when they are left free to fill their own time according to their own choice, are at a loss to think of anything sufficiently pleasant to be worth doing. And whatever they decide on, they are troubled by the feeling that something else would have been pleasanter.',j:'たいていの人は、自分自身の選択に基づいて、自分自身の時間を自由に過ごしてよい状態におかれると、やるに値するほど十分に楽しいことを考えあぐねて途方にくれる。そして、たとえ何をやると決意したにせよ、もっと他のことをやっていたならば、より楽しかっただろうという気持ちに悩まされるのだ。',a:'034.wav'},
{id:'t035',c:'toushizu',t:'035',e:'Twenty-five years or so ago, when I was very young indeed and the world was not yet so uncomfortable a place as it has since become, I remember hearing a wise old gentleman remark that, in his opinion, the French revolution was a great mistake.',j:'25年くらい前、私がまだとても若くて、世の中はその後不快な場所になったが、まだそれほど不快な場所ではなかったころ、ある賢明な老紳士が、自分の考えでは、フランス革命はたいへんな誤りであったと述べるのを耳にしたことを覚えている。',a:'035.wav'},
{id:'t036',c:'toushizu',t:'036',e:'If you will mount the saddle and travel right along with an author toward the destination that he has in mind, your reading journey will be much more swift and sure than if you travel with a goal of your own which differs from his.',j:'もしあなたが馬に乗って、著者といっしょに著者が考えている目的地のほうへずっと進もうとするなら、あなたの読書の旅は、著者のとは異なるあなた自身の目標をもって旅する場合と比べて、はるかに速くかつまた確実なものとなるでしょう。',a:'036.wav'},
{id:'t037',c:'toushizu',t:'037',e:'Medical evidence indicates that women on the average, though not so strong as men in muscular development, are less prone to disease, and though they may complain more frequently of minor illness, they live longer.',j:'医学的証拠の示すところによれば、女性は平均すると、筋肉の発達の点では男性に劣るが、男性と比べると病気にかかりにくく、また、男性よりもちょっとした病気を訴えることは多いようだが、男性よりも長生きするのである。',a:'037.wav'},
{id:'t038',c:'toushizu',t:'038',e:'The emotions of sympathy, love, anxiety, grief, anger, fear can sometimes be more adequately expressed without words. The same is true of joy, relief and amusement.',j:'同情、愛、不安、悲しみ、怒り、恐怖といった感情は、言葉を用いないほうが適切に表現できる場合がある。同じことが、喜び、安堵、楽しさについても言える。',a:'038.wav'},
{id:'t039',c:'toushizu',t:'039',e:'The sunshine that falls each year on roads in the United States contains twice as much energy as does the fossil-fuel used annually by the entire world.',j:'毎年、合衆国の道路にふりそそぐ日光には、毎年世界中で使用される化石燃料に含まれているエネルギーの2倍のエネルギーが含まれている。',a:'039.wav'},
{id:'t040',c:'toushizu',t:'040',e:'Sight conveys more information about the outside world than does any of the other human senses. This is shown by the large part of the brain devoted to analysing visual sensations.',j:'視覚は、他の人間の感覚のいかなるものが伝えるよりも、外界について多くの情報を伝える。このことは、頭脳の大部分が、目で感じ取るものの分析に向けられていることによって示されている。',a:'040.wav'},
{id:'t041',c:'toushizu',t:'041',e:'Today, we do not expect our children to work, either at home or in a factory. They contribute nothing to the economic well-being of the family. They are freer than they have ever been before simply to be children. We see them as the centre of the family, around which the rest of life revolves.',j:'今日、われわれは、家庭でも工場でも、子供が働くことなど期待していない。子供は、家庭が経済的に楽になることに何の貢献もしていない。彼らは、これまでよりも、自由に単に子供であることに徹することができる。われわれは、子供を家庭の中心とみなしており、生活の他の部分は、その中心を軸にして回転しているのである。',a:'041.wav'},
{id:'t042',c:'toushizu',t:'042',e:'Without the aggressive, active side of his nature man would be even less able than he is to direct the course of his life or to influence the world around him.',j:'人間の性質の攻撃的で活動的な面がないのであれば、人間が自分の人生の方向性を定めたり、周囲の世界に影響を与えたりする能力は、今と比べて著しく劣っていることだろう。',a:'042.wav'},
{id:'t043',c:'toushizu',t:'043',e:"Television has opened windows in everybody's life. No newspaper has ever reached so many people and shown so clearly what was happening right now in their own country and everywhere else.",j:'テレビはすべての人々の生活に窓を開いた。テレビほど、多くの人々の手元に届いたことのある新聞もなければ、自分の国の中でのこと、そして他のどこであれ、ちょうど今起こっていることをテレビほどはっきり伝えたことのある新聞もない。',a:'043.wav'},
{id:'t044',c:'toushizu',t:'044',e:'In no respect do Japanese and Americans display greater difference than in their attitude concerning employment. When a Japanese graduates from a high school or university he is likely to seek a position that will provide him with lifetime employment. Taking a job is thus as important a step as taking a wife, and the results are likely to last as long.',j:'就職に関しての態度より、日本人とアメリカ人との間に大きな違いが見られる点はない。日本人は、高校あるいは大学を卒業すると、一生そこで働ける勤め口をまず探す。だから、職に就くということは、妻を得ることと同じように大切なことであり、その結果も、妻を得ることと同じように長く続く可能性がある。',a:'044.wav'},
{id:'t045',c:'toushizu',t:'045',e:'If you choose your friends on the ground that you are virtuous and want virtuous company, you are no nearer to true friendship than if you choose them for commercial reasons.',j:'自分にはすぐれた点があるから、すぐれた点を持った友達が欲しいという理由で友達を選ぶならば、打算的な理由で選ぶ場合と同様、真の友情とはほど遠いものである。',a:'045.wav'},
{id:'t046',c:'toushizu',t:'046',e:'No one can tell another person in any definite way how he should think, any more than how he ought to breathe or to have his blood circulate.',j:'どのように呼吸すべきか、どのように血液を循環させるべきかを、他人に明確に言える人がいないのと同様に、どのように思考力を働かすべきかを他人に明確に言える人はいない。',a:'046.wav'},
{id:'t047',c:'toushizu',t:'047',e:'Anybody who travels to Japan by way of Asia must feel on arrival that he has entered a semi-Western environment. Yet the longer he remains in the country, the more clearly he will perceive that Western ideas and techniques sometimes undergo a subtle but definite change when planted to Japan.',j:'アジア経由で日本へと旅行する人は誰でも、日本に着いた途端に、なかば西洋的な環境に入ってきたと感じるに違いない。しかし、その人はこの国に長く滞在すればするほど、それだけ一層明瞭に、西洋的な思想や技術が、日本に移入された際には微妙だが明確な変化を受けることがあるということに気づくだろう。',a:'047.wav'},
{id:'t048',c:'toushizu',t:'048',e:'The primary aim of science is to find truth, new truth. This search is the more successful the more it is directed towards finding truth for its own sake, regardless of its possible practical use or application.',j:'科学の第一の目的は、真理、それも新しい真理を発見することである。この探究は、真理の実用や応用の可能性とは無関係に、真理そのもののために真理を探究しようとする方向に向けられていればいるほど、その分だけ大きな成功を収める。',a:'048.wav'},
{id:'pp001',c:'polepole',t:'001',e:'Frank talks between an adolescent and his parents often reveal that the adolescent is basically willing to rely on his parents for protection in many situations.',j:'若者と両親とが率直に話し合えば、若者は基本的には、多くの状況において両親の保護に頼るのを拒んでいないのだとはっきりすることが多い。',a:'pp001.wav'},
{id:'pp002',c:'polepole',t:'002',e:'On the ability of individuals to learn to live in harmony with others depends the future of mankind and the world.',j:'個々の人間が他人と調和して生活するようになれることに、人類と世界の将来はかかっているのである。',a:'pp002.wav'},
{id:'pp003',c:'polepole',t:'003',e:'Among topics we discussed over lunch was the regrettable habit film directors then had of altering the plot of a novel to suit themselves, to the extent even of changing a sad ending into a happy one.',j:'昼食をとりながら話題の中で当時の映画監督の困った癖についての話が出た。彼らは自分の都合で小説の筋を変え、悲しい結末をハッピーエンドにすることさえあるのだ。',a:'pp003.wav'},
{id:'pp004',c:'polepole',t:'004',e:'The scientist and the theologian approach the deep questions of existence from utterly different starting points. Science is based on careful observation and experiment enabling theories to be constructed which connect different experiences. Regularities in the workings of nature are sought which hopefully reveal the fundamental laws that govern the behavior of matter and forces. Central to this approach is the willingness of the scientist to abandon a theory if evidence is produced against it.',j:'科学者と神学者は全く違った出発点から深い存在の問題に取り組む。科学は異なる経験を結び付ける理論の構築を可能とする注意深い観察と実験に基づいている。事物や諸力の作用を支配する根本的な法則をうまくいけば明らかにしてくれるような自然現象における規則性が求められているのである。この取り組み方の中心にあるのはある理論を否定する証拠が得られた場合には、その理論を捨てるのを拒まない科学者の姿勢である。',a:'pp004.wav'},
{id:'pp005',c:'polepole',t:'005',e:'And since the kings were more likely than the farmers to influence world events and to have biographies written about them, what we know of history has been largely shaped by the careers of famous men.',j:'そして、王達は農夫達より世の中の出来事に影響を与えたり、自分達の伝記を書かせる可能性が高かったので、われわれが歴史について知っていることはおもに有名人の経歴によって、形成されているのである。',a:'pp005.wav'},
{id:'pp006',c:'polepole',t:'006',e:'I do not consider that making no mistakes is a blessing. I have erred once, but I shall not make the same mistake again. Nothing is gained by wasting time in regretting mistakes. It is much better to employ that time in analyzing and correcting what is wrong. The greatness of man does not lie in his being faultless. Error is sometimes inevitable. The real virtue of man lies in recognizing that faults can be set right and in striving to correct them.',j:'間違えないことが素晴らしいことなのではないと私は考えている。一度は間違えるが、同じ間違えを私は断じて繰り返さない。間違えを後悔することに時間を浪費しても得られるものはない。間違えていることを分析し修正することにその時間を使う方がはるかによい。人間の偉さは間違えないことにあるのではない。というのは、間違えは避けられないこともあるからである。人間の真の美徳は間違えは修正できるのだと認識しそれらを修正しようと努力することにあるのである。',a:'pp006.wav'},
{id:'pp007',c:'polepole',t:'007',e:'To write about human aggression is a difficult task because the term is used in so many different senses. Aggression is one of those words which everyone knows, but which are nevertheless hard to define. One difficulty is that there is no clear dividing line between those forms of aggression which we all deplore and those which we must not disown if we are to survive.',j:'人間の攻撃性について書くことは、攻撃性という言葉が非常に多くの意味で使用されているので、難しい作業となる。攻撃性という言葉は誰もが知っていながらも定義するのは難しい言葉だからである。ひとつには、誰もが嘆かわしいと思うような攻撃の形態と、生き残るためには持っていなければいけない攻撃の形態の間に、それらをはっきりと区別する一線をひくことができないという難しさがある。',a:'pp007.wav'},
{id:'pp008',c:'polepole',t:'008',e:'Yet it is a very plain and elementary truth that the life, the fortune, and the happiness of every one of us, and more or less, of those who are connected with us, do depend upon our knowing something of the rules of a game infinitely more difficult and complicated than chess.',j:'しかし、非常に明白で基本的な事実なのだが、私たちのひとりひとり、また多かれ少なかれ私たちと関わりのある人達の生活、運、幸福はチェスよりもはるかに難しく複雑なゲームのルールについて私たち自身が多少なりとも知っているかどうかに、実際に左右されるのである。',a:'pp008.wav'},
{id:'pp009',c:'polepole',t:'009',e:'It might be said that every dictionary is the dictionary of a dead language. No matter how fast and how thorough a dictionary-maker may be, by the time he has gathered his words, written descriptions of them, and published his book, old words will have changed and new ones will have come into being.',j:'すべての辞書は死んだ語の辞書であるといえるだろう。というのは、辞書編纂者がどれほど敏速で、またどれほど完全であろうとも、単語を集め、その記述をし、自分の著書を出版するまでには、古くからある語は変化し新しい語が生まれてしまっているだろうからだ。',a:'pp009.wav'},
{id:'pp010',c:'polepole',t:'010',e:'Earlier studies suggested that the link was proved. More recent research suggests that the damage is more subtle. Teenagers do not see a murder on TV and feel encouraged to knife someone as a direct result.',j:'以前の研究ではその関係は明らかであるとされていた。しかし最近の研究によるとその害はもっと微妙である。例えば十代の若者がテレビで殺人を見てその直接的結果として誰かをナイフで刺したくなるということはないのだ。',a:'pp010.wav'},
{id:'pp011',c:'polepole',t:'011',e:'To form a society individuals must be related in a certain manner. For instance, if people do not communicate with each other, if they are perpetually in aggressive physical combat, if they do not cooperate with each other, and do so routinely over a period of time, then their interactions are not social and they don\'t constitute a society.',j:'社会を構成するためには個々人が何らかのやり方で関係しあわなければならない。例えば、人々が互いに意思の疎通をしない場合、常に攻撃的な戦闘状態である場合、互いに協力する、しかもある一定の期間にわたって日常的に協力するというのでない場合には、人々の互いの関係は社会的ではないし、社会を構成することにはならない。',a:'pp011.wav'},
{id:'pp012',c:'polepole',t:'012',e:'The fact that animals lose their knowledge of things as time goes by, and consequently their interest in them, accounts for their absurd behavior in many situations. They constantly interrupt one line of action to do something else, and they may come back to the first activity or forget it altogether. Human beings, on the other hand, thanks to language, are able to pursue one purpose or to act in relation to a principle or to an ideal over long periods of time.',j:'動物が時の経過とともに物事を忘れてしまい、その結果、それらに対する興味を失ってしまうという事実を考えると、多くの状況における動物の愚かな行動は説明がつく。かれらは、常に何か別のことをするために、一連の行動を中断し、その結果、はじめの行動に戻ったりそれを完全に忘れてしまったりするのだろう。他方、人間は、言語のおかげで、長い期間にわたって、一つの目的を追求したり、一つの原則や理想に関連しながら行動することができる。',a:'pp012.wav'},
{id:'pp013',c:'polepole',t:'013',e:'Without language, man would communicate only simple thoughts, ideas, and experiences. But with language, he can talk to other men and he can put his talk into writing for other men to read. By these means he can make known to others all of his thoughts, ideas, feelings, and experiences.',j:'言語がなければ、人間は単純な思考や着想や経験しか伝えられないであろう。しかし、言語があるので、人間は他の人と話しができるし、他の人が読めるように自分の言葉を文書にすることもできる。これらの手段によって、人間は自分の思考、着想、感情や経験のすべてを他人にわからせることができるのである。',a:'pp013.wav'},
{id:'pp014',c:'polepole',t:'014',e:"However, I feel that the teacher's role is more fundamental than the critic's. It comes down ultimately, I think, to the fact that his first obligation is to the truth of the subject he is teaching, and that for the reading of literature ever to become a habit and a pleasure, it must first be a discipline.",j:'しかし、教師の役割は批評家の役割よりも重要であると私は感じている。最終的に重要なのは、教師の第一の義務は自分が教えている科目の真実性に対するものであるということ、また、いつか文学を読むことが習慣、喜びとなるためには、まずは文学を読むことが訓練でなければならないということになると考えているからだ。',a:'pp014.wav'},
{id:'pp015',c:'polepole',t:'015',e:"'Popular' music can be said to comprise all the various kinds of music that might not be considered under the general heading of 'serious' or 'classical' music. The division between the two worlds has always been fairly clearly defined, with those active in one sphere rarely trespassing in the other, and never more so than today, when, instead of the distinction being based on fluctuating artistic 'taste', it is fairly firmly based on economic considerations.",j:'「ポピュラー」音楽は、「本格的な」音楽すなわち「古典」音楽という一般的な項目に入れられないと考えられる様々な種類の音楽すべてを包括しているといえる。一方の領域で活動している人達が他方の領域を侵害することはなく、その二つの世界の境界は、つねにかなり明確に区分されてきたが、両者の境界が揺れ動く芸術的「嗜好」に基づくのではなく、経済的な事情にかなりはっきりと基づいている今日では、これまで以上に明確に区分されている。',a:'pp015.wav'},
{id:'pp016',c:'polepole',t:'016',e:'The first great change in their life style came when, instead of hunting and gathering animals and plants, they brought them together and looked after them in a single location. This eliminated the element of danger present in hunting and reduced the probability of starvation, as there was no longer the possibility of returning empty-handed from a foraging expedition. It was the beginning of agriculture.',j:'動物や植物を狩ったり、集めたりするのではなく、それらをまとめて一箇所で、世話をするようになったときに、生活様式に初めての大きな変化が生じたのである。このことで、狩りに伴う危険の要素はなくなり、飢えの可能性は小さくなった。もはや、食糧あさりの遠出から手ぶらでもどってくる可能性がなくなったからである。それが、農業の始まりだった。',a:'pp016.wav'},
{id:'pp017',c:'polepole',t:'017',e:'Where do the pollutants come from? There are two main sources - sewage and industrial waste. As more detergent is used in the home, so more of it is finally discharged with the sewage into our rivers, lakes and seas. Detergent harms water birds by dissolving the natural fatty substances which keep their feathers waterproof. Sewage itself, if it is not properly treated, pollutes the water and prevents all forms of life in rivers and the sea from receiving the oxygen they need.',j:'汚染物質はどこから生じるのか。二つの主たる源がある。下水と産業廃棄物である。家庭内で洗剤使用量が増えるのにつれて、最終的に下水とともに、河川、湖、海に排出される洗剤の量も増える。洗剤は、水鳥の羽毛を防水状態に保っている天然の脂肪質を溶かすことによって、水鳥に害を与える。下水自体も、適切な処理がなされない場合には、水を汚染し、河川や海のあらゆる形態の生物が、必要とする酸素を摂取することを妨げることになるのである。',a:'pp017.wav'},
{id:'pp018',c:'polepole',t:'018',e:'Even when the sexism is not built into the grammar and usage, as it is in French and English, the speech community often regards masculine values as the norm. Successive generations unconsciously absorb sexism in language because each speech community conveys to its children both a way to construct grammatical sentences and a value system for the use of its language.',j:'英語やフランス語と違って、性差別がその言語の文法や慣用法の中に組み込まれていない場合でさえ、言語共同体は男性の価値観が標準であるとみなすことが多い。連続する世代はそれぞれの言語共同体が、文法的に正しい文の構成法とその言語の使用のための価値体系の両方を、子供に伝えるので、言語に含まれる性差別を無意識のうちに吸収することになる。',a:'pp018.wav'},
{id:'pp019',c:'polepole',t:'019',e:'It is not uncommon for strained relationships to develop between an adolescent and his parents. In his great eagerness to achieve adult status, the young person may resent any restrictions placed upon him. Oftentimes he is not willing to admit, even to himself, that he has doubts and fears about taking on adult responsibilities and freedom. The adolescent may say that his parents are over-anxious and over-protective whereas, though not aware of it, he is projecting his own anxiety into them.',j:'若者と両親の間で緊張関係が高まることは特別なことではない。大人の地位を得ることを非常に強く切望しているので、若者は自分に課されるあらゆる制約をいやに思うのである。自分が大人の責任と自由を引き受けることに対して疑念や恐れを抱いていることは、自分に対してさえ認めたがらないことが多い。親は心配症で過保護だと若者はいうかもしれないが、一方では意識はしていないのだが、自分自身の不安を親におしつけているのである。',a:'pp019.wav'},
{id:'pp020',c:'polepole',t:'020',e:"Although the city dweller's dealing with people whom he doesn't know very well gives him, on the one hand, a certain degree of freedom that he would not have if he were dealing with family and friends in a small town, he loses, on the other hand, the sense of security that comes from living in a close-knit community.",j:'都市に住む人は、あまりよく知らない人を相手にすることで、一方では、小さな町で家族や友人を相手にしている場合には得られないであろう一定の自由を享受できるが、他方では、緊密な社会に住むことから生じる安心感を失うことになる。',a:'pp020.wav'},
{id:'pp021',c:'polepole',t:'021',e:'The assertion that mathematics has been a major force in the molding of modern culture, as well as a vital element of that culture, appears to many people incredible, or at best, an extreme exaggeration. This disbelief is quite understandable and results from a very common but mistaken conception of what mathematics really is.',j:'数学は、現代文化の不可欠な要素であるばかりではなく、現代文化の形成における主要な原動力であるという主張は、多くの人には信じ難く思われるであろうし、せいぜい極度な誇張と思われることだろう。この主張を信じられないのはよく理解できることではあるが、それは、数学の本質についての、ごく一般的ではあるが間違っている概念の結果なのである。',a:'pp021.wav'},
{id:'pp022',c:'polepole',t:'022',e:'The crucial issue is whether the essence of life resides in the heart or in the brain. Because the body rarely shuts down all its systems at once, and because hospitals have access to the most modern life-preserving machinery, it is entirely possible that the brain, deprived of an adequate supply of oxygen, could die while the patient, often with the help of hospital equipment, remains alive.',j:'決定的な問題は、生命の本質が心臓にあるのか、脳にあるのかということである。人体がすべての系統を同時に停止することはまれであるし、病院は最も現代的な生命維持装置を利用できるということもあって、脳は十分な酸素の供給を奪われれば死ぬ可能性があるが、一方患者の側は、多くの場合病院の装置のおかげで生存し続けるということは十分可能である。',a:'pp022.wav'},
{id:'pp023',c:'polepole',t:'023',e:'In the world of nature there are always compensations. As a country lad, I became familiar at an early age with the farming maxim that "there is never a year when every crop succeeds, nor when every crop fails." In recent years a farming elite and its advisers have started to assume otherwise. They have been convincing themselves that if they prepare their plans according to the latest scientific knowledge and put them efficiently into practice, success is assured.',j:'自然界には常に埋め合わせが存在する。田舎の少年として私は、幼い頃から「すべての作物が豊作となる年はないし、すべての作物が不作となる年もない」という農業の格言を知っていた。近年、エリート農民やその助言者はそれとは異なる考え方をし始めている。彼らは、最新の科学知識によって計画を整え、それを能率的に実行すれば、成功は保証されていると信じこもうとしている。',a:'pp023.wav'},
{id:'pp024',c:'polepole',t:'024',e:"The social experiences and values of the old and the young have always been in conflict; if younger people did not question the advice and beliefs of their parents, little change of 'progress' would ever occur. But with the accelerating speed of change in modern times, the conflicts between members of different generations, or between those people anxious to adjust to change and those less inclined to do so, were in danger of becoming more harmful than helpful. Furthermore, the very phrase by which these conflicts are described, the 'generation gap', was becoming out of date.",j:'老人と若者の社会的経験と価値観は常に対立してきた。若者が親の忠告や信念に疑問をもたないのならば進歩という変化はほとんど生じないであろう。しかし、現代、変化が加速するにつれて、世代の異なる人々、つまり変化に適応することを切望する人とそれほどそう思っていない人との間の対立は、有用であるよりはむしろ有害になる危険があった。さらに、こういう対立を表現するジェネレーションギャップという言葉そのものが時代遅れになりつつあった。',a:'pp024.wav'},
{id:'pp025',c:'polepole',t:'025',e:'By reason of the fact that educated English is thus accorded implicit social and political sanction, it comes to be referred to as Standard English, and provided we remember that this does not mean an English that has been formally standardized by official action, as weights and measures are standardized, the term is useful and appropriate.',j:'教養英語はこのように一定の暗黙の社会的、政治的容認をうけているので、標準英語と呼ばれるようになってきている。このことが、度量衡が標準化されているように公的措置によって、標準化された英語を意味するものではないということを銘記しておけば、この用語は、有効であり、適切である。',a:'pp025.wav'},
{id:'pp026',c:'polepole',t:'026',e:'There is general apathy to if not positive distrust of science itself as a search for truth; for, to the ordinary American, science is identified with mechanical inventions. Ask an American to name the greatest scientist of this country and he will very likely reply, "Edison". As a nation, we respect only the practical application of science and have regard for the efforts of inventors and promoters rather than those of the scientific discoverers.',j:'真理探究としての科学そのものに対して、積極的不信感があるとはいわないまでも一般的な無関心がある。というのは、普通のアメリカ人にとって、科学は機械の発明と同一視されているからである。アメリカ人に、アメリカの最大の科学者の名前をあげるように求めると、エジソンと答える可能性はかなり高いだろう。国民として、アメリカ人は科学の実用的適用のみを重視し、科学的発見者の努力ではなく発明者や推進者の努力を尊重しているのである。',a:'pp026.wav'},
{id:'pp027',c:'polepole',t:'027',e:'Today, we do not expect our children to work, either at home or in a factory. They contribute nothing to the economic well-being of the family. They are freer than they have ever been before simply to be children. We see them as the centre of the family, around which the rest of life revolves; we protect them from responsibilities which were forced on earlier generations.',j:'今日では、われわれは家庭内であれ、工場であれ、自分の子供たちが働くことを期待していない。子供たちは家庭が経済的に楽になることには全く貢献していないのである。今日の子供は以前よりも自由にただ子供でいられるのである。われわれは、子供が家族の中心であるとみなしており、子供を中心に残りの生活が回っているのである。つまり、われわれは子供たちを昔の子供たちにおしつけていた責任から保護しているのである。',a:'pp027.wav'},
{id:'pp028',c:'polepole',t:'028',e:'The aggressive part of human nature is not only a necessary safeguard against savage attack. It is also the basis of intellectual achievement, of the attainment of independence, and even of that proper pride which enables a man to hold his head high amongst his fellows. Without the aggressive, active side of his nature man would be even less able than he is to direct the course of his life or to influence the world around him.',j:'人間の性質の攻撃的な側面は、外敵の攻撃に対する必要な安全装置であるばかりではない。それは、知的業績、独立心の獲得、さらには仲間の中で頭を高くしておくことを可能にするようなしかるべき誇りの基ともなっているのである。人間の性質の攻撃的、積極的側面がなければ、人間は自分の人生の方向付けをしたり、自分の回りの世界に影響を与えたりすることは、今ほどにはできないであろう。',a:'pp028.wav'},
{id:'pp029',c:'polepole',t:'029',e:'The sheer numbers of Europeans who left their homelands in the century before 1914 to go overseas suggest how important was the movement of which they were a part.',j:'1914年以前の1世紀間で、海外に行くために故国を離れたヨーロッパ人の本当の数をみると、彼らを一部とする移動が、いかに重要なものであったかがわかる。',a:'pp029.wav'},
{id:'pp030',c:'polepole',t:'030',e:'I have always wondered at the passion many people have to meet the celebrated. The prestige you acquire by being able to tell your friends that you know famous men proves only that you are yourself of small account.',j:'私はいつも多くの人が持っている、有名人に会いたいという情熱を不思議なものだと思っている。有名な人を知っていると友人に言えることで名声を得ても、自分自身が取るに足らない人物であることを示すばかりである。',a:'pp030.wav'},
{id:'pp031',c:'polepole',t:'031',e:'Manual labor was highly valued. Later it was the man who worked with his head to achieve success in business and industry who was looked up to. Now there is in America a curious combination of pride in having risen to a position where it is no longer necessary to depend upon manual labor for a living and genuine delight in what one is able to accomplish with his hands.',j:'肉体労働は高く評価されていた。後になって、尊敬されるようになったのは、商業や工業で、成功をおさめるのに、頭を使って、働いた人間であった。現在、アメリカにおいては、生計を立てるのにもう肉体労働に頼る必要のない地位に上がったということに対する誇りと、手を使ってなし遂げることのできるものについての純粋な喜びが奇妙にいりまじっている。',a:'pp031.wav'},
{id:'pp032',c:'polepole',t:'032',e:'In fairy tales, as in life, punishment or fear of it is only a limited deterrent to crime. The conviction that crime does not pay is a much more effective deterrent, and that is why in fairy tales the bad person always loses out. It is not the fact that virtue wins out at the end which promotes morality, but that the hero is most attractive to the child, who identifies with the hero in all his struggles. Because of this identification the child imagines that he suffers with the hero his trials and hardships, and triumphs with him as virtue is victorious.',j:'実生活と同様に、お伽噺では、罰または罰の恐怖は犯罪に対しては、限られた抑止としかならない。犯罪は割りに合わないという確信のほうがはるかに有効な抑止力となる。そういうわけで、お伽噺では悪人は常に最後には負けるのである。道徳を促進するのは、徳がさいごには勝つという事実ではなく、主人公が子供にとって最も魅力があり、子供は主人公のすべての苦闘において主人公と一体化しているという事実なのである。この一体化のために、子供は主人公とともに試練と苦難をあじわい、美徳が勝利をおさめるときには、主人公とともに勝ち誇る姿を思い浮かべるのである。',a:'pp032.wav'},
{id:'pp033',c:'polepole',t:'033',e:'The thing that saves most of us from feeling terrible about our limited intellect is some small part of our personality or character that makes us different. Being uniquely ourselves makes us feel better about not being smart. It\'s those little differences we have that keep us from committing suicide when we realize, early in life, that a lot of people have more brains than we have.',j:'われわれのほとんどを自分の限られた知能について絶望することから救っているのは、自分の個性や性格になんらかの他人と違う部分があるということである。独特であるおかげで、自分が頭がよくないことについて、まだましに感じているのである。若い頃に、自分より頭のよい人が多勢いると気づいても自殺しないですむのは、われわれが持っているちょっとした違いのおかげである。',a:'pp033.wav'},
{id:'pp034',c:'polepole',t:'034',e:'A puppy raised apart from other dogs will know how to bark when he gets old enough, but the few children we know of who grew up without human contact grew up almost mute. Babies in understaffed foundling hospitals, who see very little of older people, are said, except for crying, to be almost silent.',j:'他の犬と離して育てられた子犬は、大きくなると吠え方を知るようになるものだが、私達が知っている子供で人間と接触しないで成長した少数の子供は成長してもほとんど全く口がきけなかった。人手不足の孤児院の赤ん坊は年上の人と会うことが非常に少ないので、泣く時以外はほとんど口をきかないといわれている。',a:'pp034.wav'},
{id:'pp035',c:'polepole',t:'035',e:'Most of our knowledge, acquired from parents, friends, schools, newspapers, books, conversation, speeches, and radio, is received verbally. All our knowledge of history, for example, comes to us only in words. The only proof we have that the Battle of Waterloo ever took place is that we have had reports to that effect.',j:'われわれの知識のほとんどは、両親や友人、学校、新聞、書物、会話、演説、ラジオから得られるのだが、言葉によって伝えられる。例えば、歴史についての知識はすべて言葉によってしか得られない。われわれが持っている「かつてワーテルローの戦いがあった」という唯一の証拠はその趣旨の報告を手にいれているということだけである。',a:'pp035.wav'},
{id:'pp036',c:'polepole',t:'036',e:'"You must learn to walk before you can run" recognizes that there are stages in learning which must be taken in the right order if success is to be achieved.',j:'「走る前に歩くことを覚えよ。」ということわざは、学習には、成功するために順序正しく踏まなければいけない段階がある、ということを認めている。',a:'pp036.wav'},
{id:'pp037',c:'polepole',t:'037',e:'Foreign language instruction should come early in the educational process, basically at the elementary level. This is because it can serve as a fundamental shaper of the child\'s perception of the world. It can help him accept the fact that there is much in the world that differs greatly from what he sees around him and to which he must learn to adapt himself.',j:'外国語教育は、教育過程の最初のうちに、基本的には初等段階で行なわれるべきである。これは、外国語教育が、世界についての子供の認識を基本的に形成するものとして役立ち得るからである。それは、世界には、自分の周りに見えるものと大きく違っていて、自分が適応するようにならなければいけないものがたくさんある、ということを子供が受け入れるのに役立ちうるのである。',a:'pp037.wav'},
{id:'pp038',c:'polepole',t:'038',e:'Today the scale of Western European pet-keeping is undoubtedly unique in human history. It reflects the tendency of modern men and women to withdraw into their own small family unit for their greatest emotional satisfactions. The fact that so many people feel it necessary to maintain a pet for the sake of emotional completeness tells us something about the present-day society in which we live.',j:'今日、西欧のペット飼育の規模は、人間の歴史上独特なものであることは疑いがない。その規模の大きさは現代の男性女性が、最大の感情的満足を求めて自分自身の小さな家族の単位に引きこもろうとする傾向を反映している。非常に多くの人が、情緒を十分に充たすためにペットを飼うことが必要だと感じているという事実をみると、われわれが生活している現在の社会について重要なことがわかる。',a:'pp038.wav'},
{id:'pp039',c:'polepole',t:'039',e:'The door, as the main point of entry into a house, has always had a place of particular importance in superstition, and the positioning over the porch of statue and good luck symbols (such as the famous horseshoe which must, of course, have the points upwards) has been specifically to keep out bad elements either human or supernatural.',j:'家に入る主要な場所としての玄関は、迷信において常に特別に重要な地位を占めてきた。そして、ポーチの上に、像や幸運のシンボルを置くことは、人間的なものであれ超自然的なものであれ、邪悪な要素を家にいれないことを特に目的としていたのである。',a:'pp039.wav'},
{id:'pp040',c:'polepole',t:'040',e:'In the age of abundance, the apparent availability of virtually all material necessities tended to lead people to expect speedy gratification of their desires and to have little sense of the length of time over which people in other times and places had had to wait in order to have some of their more basic material needs satisfied.',j:'豊かさの時代には、一見、ほとんどすべての物質的必需品が手に入りそうに思えるので、人々は自分の欲求をすぐに充たせると思い、他の時代や場所の人々だと、さらに基本的な物質的必要が充たされるために待たなければならなかった時間の長さを理解する能力をほとんど失ってしまう傾向があった。',a:'pp040.wav'},
{id:'pp041',c:'polepole',t:'041',e:'Thus I learned from life itself. At the beginning I was only a little mass of possibilities. It was my teacher who unfolded and developed them. When she came, everything about me breathed of love and joy and was full of meaning. She has never since let pass an opportunity to point out the beauty that is in everything, nor has she ceased trying in thought and action and example to make my life sweet and useful.',j:'こうして私は人生そのものから学んだ。初めは、私は、可能性をもつ小さなかたまりでしかなかった。その可能性を開示し、発展させてくれたのは私の先生だった。先生が来ると、私の周りのすべてのものが、愛と喜びで息づき、意味で満ちあふれた。それ以来、先生はすべてのものの中にある美を指摘する機会を逃すことはなかったし、考えや行動や実例の点で、私の生活を楽しく有益にしようとすることを決してやめなかった。',a:'pp041.wav'},
{id:'pp042',c:'polepole',t:'042',e:'Men can communicate; so can the other animals. But men can communicate across the barriers of time and space, while the other animals cannot, for man alone holds the secret of the greatest of all inventions: the written word. Beside this, the telephone, the radio, the television are the toys of children. Only recently, in fact, have men conquered, by means of the spoken word, any space larger than that over which the natural voice will carry, whereas down through the long course of history, writing has been of inestimable service in bringing men and nations closer together. We should know little enough, indeed, of that very history if we had to rely on oral tradition alone.',j:'人間は意思の疎通ができるが、他の動物もできる。しかし、人間は時間と空間の壁を越えて意思の疎通ができるが、他の動物はできない。というのは、人間だけが、すべての発明の中で最も偉大なものの秘密、つまり書き言葉を持っているからである。これと比べると、電話、ラジオやテレビは子供のおもちゃである。実際、ごく最近になってはじめて、人間は話し言葉によって、自然の声が伝わる以上に広い空間を征服したのであるが、他方、長い歴史の過程で、書き言葉は人々や国家をより密接に結び付けるのに、計り知れないほど役立ってきた。話し言葉のみに頼らねばならないとすれば、実際のところ、歴史そのものについて十分に知ることはほとんどないであろう。',a:'pp042.wav'},
{id:'pp043',c:'polepole',t:'043',e:'In my experience the problem of what to do in life was not made any easier by those who were in charge of my education. Looking back, it seems most odd that never once in all the years that I was at school was there any general discussion about careers.',j:'私の経験では、人生で何をするかという問題は、私の教育を担当した人達のおかげで少しでも容易になるということはなかった。振り返ってみると、私が学校にいた全年月の間、一度も職業について視野の広い議論がなかったというのは、とても奇妙なことに思える。',a:'pp043.wav'},
{id:'pp044',c:'polepole',t:'044',e:'Historians have described how life periods became demarcated in Western societies over the past centuries. Only with industrialization and the appearance of a middle class and formally organized schools did childhood become a clearly definable period of time.',j:'歴史家達は、西欧社会において、過去の数世紀の間に、人間の一生がどのように区分されるようになったかを述べてきた。産業化と中流階級および公的に組織化された学校の出現があって初めて、子供時代は明確に区分されうる人生の一時期となったのである。',a:'pp044.wav'},
{id:'pp045',c:'polepole',t:'045',e:'So important is the role of the environment that talking of an "innate" tendency to be aggressive makes little sense for animals, let alone for humans. It is as if we were to assert that because there can be no fires without oxygen, and because the Earth is blanketed by oxygen, it is in the nature of our planet for building to burn down.',j:'環境の役割は非常に重要なので、攻撃的な性向は「生まれつきの」ものであるというのは、動物に対してほとんど意味を成さない、もちろん人間に対してもそうであることは言うまでもない。そんなことを言うのは、酸素がなければ火事は起こり得ないし、また地球は酸素におおわれていることでもあるから、建物が燃え落ちるのが地球の生まれつきの性質である、と主張しようとするようなものである。',a:'pp045.wav'},
{id:'pp046',c:'polepole',t:'046',e:'This state of things might have lasted until his working life had ended in the natural way had not his employer, the head of the firm, died and his son, a young man with modern ideas and a determination to increase his business, come into possession.',j:'その会社の社長である彼の雇い主が死んで、現代的な考え方と事業を拡張しようという決意を持った若い息子がその会社を所有するようにならなかったならば、このような状況は彼の職業生活が自然な形で終わるまで続いたかもしれない。',a:'pp046.wav'},
{id:'pp047',c:'polepole',t:'047',e:'Such vegetative reproduction he viewed as a step towards the rearing of plants following seeding, and it was at this intermediate stage in south-east Asia that plants such as taro, yam, banana, breadfruit, and sugarcane evolved.',j:'彼はそういう植物再生産を種まきに続く植物栽培への一段階と考えたのである。そして、タロイモ、ヤムイモ、バナナ、パンの木、サトウキビなどの植物が進化したのは東南アジアのこの中間段階においてであった。',a:'pp047.wav'},
{id:'pp048',c:'polepole',t:'048',e:'In the 1850s and 1860s British railway companies ensured uniform time at stations by arranging for clock manufacturers to send a man once a week from station to station to ensure that the clocks were keeping good time. At every station a porter would be told to have a ladder ready and wait while the clockman ascended, wound the clock, and adjusted the hands. If necessary the train would be kept a minute or two for him so that he could do the journey down the line in one day.',j:'1850年代と1860年代には、英国の鉄道会社は、時計製造会社に、確実に時計の時間が正確であるように週に一度駅から駅へと人を派遣する手配をさせることによって、各駅の時間が確実に統一されるようにしていた。各駅では、赤帽は、はしごを準備し、時計係員がはしごに上り、時計のねじを巻き、針を調整する間待つように命じられた。時計係員が、一日でその路線の駅をまわりきれるように、必要ならば1、2分彼のために汽車は止めておかれたものであった。',a:'pp048.wav'},
{id:'pp049',c:'polepole',t:'049',e:'The road user carries much of the responsibility for traffic accidents: the vehicle driver for the safety of others as well as himself, the pedestrian mainly for his own safety, while the passenger carries relatively little responsibility.',j:'道路の利用者は交通事故の責任の大部分を担っている。車を運転する人は、自分自身の安全だけでなく他人の安全に対しても責任を担っているし、歩行者は主に自分自身の安全に対して責任がある、が一方、車に乗せてもらっている人にはそれと比べてほとんど責任がない。',a:'pp049.wav'},
{id:'pp050',c:'polepole',t:'050',e:'Emotions are everywhere the same, but the artistic expression of them varies from age to age and from one country to another. We are brought up to accept the conventions current in the society into which we are born. This sort of art, we learn in childhood, is meant to excite laughter, that to provoke our tears. Such conventions vary with great rapidity, even in the same country.',j:'感情はどこでも同じものである。しかし、芸術における感情表現は、時代によって、また国によって、さまざまである。われわれは、自分の生まれ落ちた社会に受け入れられている慣習を受け入れるように育てられる。このような表現は笑いをひきおこすことになり、あのような表現は涙を誘うことになるといったことは、子供時代に身につけるのである。そういった慣習は、同じ国の中でさえ、非常に急速に変化するものである。',a:'pp050.wav'},
{id:'tc01',c:'toushizu',t:'C01',e:'The view of the world below from the top of a mountain surrounding mountains, the valleys and rivers, the towns, on a sunny day is very clear. We can easily identify the farms and forest. The historian who writes of the distant past can view that world from the mountain, although no two historians would agree completely on what they see. But there are no mountain peaks from which historians of the modern era can look over the past. Indeed, they often feel like a man lost deep in the forest: he can see the trees, but not even the forest as a whole. Yet, somehow, historians or political scientists studying our own age must try to identify the landmarks that lead to the present. They must select from the countless events of recent history those which seem the most important and which provide some clue to the mysteries of modern history. For only some understanding of the past enables us to know where we are and provides some paths through the forests in the future.',j:'晴れた日に山頂から見た下の世界の眺めは常に鮮明である。周囲の山々、谷や川、町。農地や森を容易に確認できる。遠い過去のことについて書き記す歴史家は、自分の目にするものについてどの2人の歴史家の意見も完全に一致するわけではないだろうが、山の上から、そういった過去の世界を見ることができる。しかし、現代史を扱う歴史家には過去を見わたせる山頂といったものは存在しない。実際、彼らは森の奥深くで道に迷った人のように感じることがよくある、つまり、木々は見えても、森全体は見えないのである。しかし、ともかく現代を研究している歴史家や政治学者は、現代につながる画期的な出来事を確認する姿勢を持たなければならない。彼らは、最近起こった無数の出来事の中から、最も重要であるように思われ、現代史の謎をとく何らかの手がかりを与えてくれる出来事を選ばなくてはならない。というのも、過去を多少とも理解するだけで、われわれが今どの地点にいるかを知ることができ、将来、森を通り抜ける道がいくつか与えられるからである。',a:'tc01.wav'},
{id:'tc02',c:'toushizu',t:'C02',e:'Television is helping to change the world. In the United States, for example, commercial television invites everyone to participate fully in the benefits of an industrial and democratic culture by buying toothpastes and detergents and automobiles, by taking an interest in national and international affairs, by sharing the emotions and dreams and aspirations and values that are depicted in the entertainment. What television communicates to whites, it also communicates, perhaps unintentionally, to black people. There is nothing to be surprised at, therefore, in the increased urgency of black people\'s demands, not only for better job opportunities, but for full rights as consumers to eat, drink, wear, and enjoy. A revolution in the patterns and techniques of communication always has more consequences than are dreamed of at the time the innovations are introduced. The increased density of the communication network in the nation and in the world resulting from technological advances means an increased tempo of social change.',j:'テレビは世界を変化させるのに寄与している。たとえば合衆国では、商業テレビが、あらゆる人に、練り歯磨きや洗剤や自動車を買ったり、国内問題・国際問題に関心を持ったり、娯楽番組で描かれる感情や夢や野心や価値観を共有することによって、産業と民主主義の文化の恩恵に十分あずかれるように誘いをかけているのだ。テレビは、白人に伝えることを、黒人に対しても、おそらく意図しないで、伝えている。したがって、よりよい仕事に対する機会だけでなく、食べる、飲む、着る、楽しむといった消費者としての十分な権利に対して、黒人が要求を訴える切実さが増大してきたことには、驚くべきことは何もない。通信形式や通信技術における革命は常に、技術革命が導入される時には夢にも思わないような多くの結果を伴うのである。科学技術が進歩した結果、国内および世界の通信網の密度が増したために、社会変化のテンポも増大しているのである。',a:'tc02.wav'},
{id:'tc03',c:'toushizu',t:'C03',e:'There is a great deal of concern today with the problem of values. Youth, in almost every country, is deeply uncertain of what values to believe; the values associated with various religions have lost much of their influence; educated individuals in every culture seem unsure and troubled as to the goals they hold in esteem. The reasons are not far to seek. The world culture, in all its aspects, seems increasingly scientific and specialized; and the rigid, absolute views on values which come to us from the past appear out of date. Even more important is the fact that the modern individual is met from every angle by different and opposing value claims. It is no longer possible to settle comfortably into the value system of one\'s ancestors or one\'s community and live out one\'s life without ever examining the nature and the accepted truths of that system.',j:'価値観の問題について、今日では、多くの懸念が見られる。ほとんどすべての国において、若者は、どんな価値観を信じればいいのかきわめて確信が持てなくなっている。様々な宗教と結びついた価値観は、その影響力の多くを失ってしまっている。あらゆる文化圏における教養ある人は、自分が尊重している目標に関して、確信が持てず悩んでいるように思われる。その理由はすぐにわかる明白なものだ。世界の文化は、あらゆる面から見て、ますます科学的になり、専門化してきているように思われ、また過去から今のわれわれに伝えられる価値観に対する固定的で絶対的な見方は、時代遅れになっているように見えるのである。それよりもはるかに重要なのは、現代の個々人は、あらゆる角度から、異質で相対立する様々な価値観の主張に直面しているという事実である。今日ではもはや、自分たちの祖先や地域社会の価値体系に安住し、その価値体系の性質や、その中で真理だと容認されていることを何ら検証せずに自分の生涯を生き抜くことは、不可能になっているのだ。',a:'tc03.wav'},
{id:'tc04',c:'toushizu',t:'C04',e:'It is often possible to make known what one wants and what he is thinking about by means of gesture, without the use of words, and it may be that men talked by signs before they used spoken language. There are many gestures which are still used to express ideas and which almost everybody understands. When one shakes his head on being asked a question we understand that he means No, just as well as if he had spoken the word. Similarly if he nods in response to a question we understand that he means Yes. But besides these two simple forms of answering a question we may express a great many other ideas by signs. Putting the first finger to the lips when someone is talking means keep quiet just as clearly as if these words were spoken aloud. Holding up both hands means I surrender. Shrugging the shoulders and shaking the head often means I don\'t know.',j:'自分が望んでいるものや考えていることを、言葉は使わずに身振りによって知らせることが可能である場合は多く、人間は話し言葉を使う前は合図で話をしていたのかもしれない。今でも考えを表すのに用いられており、ほとんどの人が理解できる身振りはたくさんある。人が質問されて首を横にふると、その人が「ノー」を意味していることが、まるで「ノー」という言葉を言ったかのようによく理解できる。同じように、質問に答えてうなずけば「イエス」のことだとわかるのである。しかし、このような2つの簡単な答え方だけでなく、それ以外の多くの考えをも、合図によって表すことがある。誰かが話しているときにひとさし指を唇にあてれば、それが「静かに」の意味であることは、その言葉を声に出して言っているかのように、はっきりとわかる。両手を上にあげれば「降参」の意である。肩をすくめて首を横にふると、「知らない」の意となることが多いのである。',a:'tc04.wav'},
{id:'tc05',c:'toushizu',t:'C05',e:'The dictionary does more than record. It also guides, perhaps nearly dictates. It informs anyone who uses it of the meanings which are generally attached to words, and therefore informs readers, especially students, how they should use the word in future if they want to make themselves clearly understood. Changes, usually gradual ones, are taking place the whole time, however, in the ways in which words are used. These changes are seldom deliberate, and may be due to a failure of education, to ignorance or stupidity, but once they have taken place, once it has become the general practice to use a word with a new, slightly changed meaning, all the editor of the dictionary can do is to record these changes.',j:'辞書は単に記録するだけのものではない。道案内もするし、おそらく命令に近いこともするであろう。辞書は、辞書を使うすべての人に、単語に通常与えられている意味を教え、したがってまた、辞書を見る人、とりわけ学生に、自分の意思を明確に伝えたいのであれば、今後、単語をどのように使わねばならないかを教えるのである。しかし、普通はゆっくりしたものだが、単語の使い方には、常に変化が起こっている。こうした変化が意図的なものであることはまずない。おそらく教育がうまくいっていないためとか、無知あるいは愚かさのために起こるのであろうが、変化がいったん起こってしまい、いったんある単語を、新しい、以前とは少し違った意味で使うのが広く習慣となってしまうと、辞書の編集者は、こうした変化を記録するほかないのである。',a:'tc05.wav'},
{id:'tc06',c:'toushizu',t:'C06',e:'When Red Riding Hood visits her grandmother she finds that a wolf has wrongfully taken the grandmother\'s place. The protective, kindly figure has been replaced by a dangerous and destructive creature. It is this exchange of figures which makes the story particularly alarming. To meet a wolf unexpectedly is frightening enough, but to find that one\'s loving grandmother has turned into this terrifying beast is to add to the situation that basic insecurity which springs from a sudden loss of trust in a person upon whom one relies.',j:'赤ずきんがおばあさんを訪ねると、狼が不当にもおばあさんと入れ代わっているのに気づく。自分を守ってくれる優しい人が、危険で危害を加える生き物に取って代わっていたのだ。この物語を特に不安にしているのは、このように人物が入れ代わる点である。不意に狼に出会うことだけでもぞっとさせるのに十分であるのに、自分を愛してくれているおばあさんがこのような恐ろしい獣に変わっていると気がつくことで、頼りにしている人間を突然信頼できなくなることから生じる根本的な不安が、この状況に加わることになるのだ。',a:'tc06.wav'},
{id:'tc07',c:'toushizu',t:'C07',e:'Thanks to modern machinery, production is outrunning consumption. Organized waste among consumers is the first condition of our industrial prosperity. The sooner a consumer throws away the object he has bought and buys another, the better for the producer. At the same time, of course, the producer must do his bit by producing nothing but the most perishable articles. The man who builds a skyscraper to last for more than forty years is a traitor to the building trade. The words are those of a great American contractor. Substitute motor car, boot, suit of clothes, etc., for skyscraper, and one year, three months, six months, and so on for forty years, and you have the gospel of any leader of any modern industry.',j:'最新の機械のおかげで、生産は消費を上回っている。消費者の間に組織的に作り出された浪費が今日の産業繁栄の第一条件である。消費者が、買った品物を捨ててもうひとつを買う時期が早ければ早いほど、生産者には好都合なのである。同時にもちろん生産者の側でも、実に壊れやすい商品のみを生産することで自らの任務を果たさねばならない。「40年以上の耐久性がある高層ビルを建てる人は建設業界の裏切り者である」。この言葉はある大手のアメリカの建築業者が言ったものである。高層ビルを車、ブーツ、スーツなどに変えれば、そして40年のところを1年、3ヵ月、6ヵ月といった言葉に変えるならば、どの産業であれ現代の産業のあらゆる指導者が一様に抱いている信条がわかるのである。',a:'tc07.wav'},
{id:'tc08',c:'toushizu',t:'C08',e:'It has been suggested that possibly technology has been used as a substitute for a more equal division of labor at home. Many men would doubtless prefer to be able to equip their wives with a super-technology kitchen rather than share housework themselves, but this in fact does not necessarily reduce the amount of time women spend there. In addition, women do not necessarily take advantage of time gained by technology, or their husband\'s help, to do things totally unrelated to housework and childcare. There is no simple relationship between the amount of time spent on housework, and factors like labor-saving devices and help from other members of the family.',j:'科学技術は、家事労働をもっと平等に分担するための代用品として使われているのではないかと言われてきた。男性の多くは、まずまちがいなしに、自分で家事を分担するよりも妻に高性能な技術のある台所を備えてやれるほうを好むであろう。しかし、このことは、実際には、必ずしも女性が台所で過ごす時間を減らすことにはならない。さらに女性は、科学技術や夫の協力によって得た時間を、必ずしも家事や子供に全く関係のないことに使っているわけではない。家事に費やす時間の総量と、労力を省く機械や家の人の協力といった要素との間の関係は、それほど単純なものではないのである。',a:'tc08.wav'},
{id:'tc09',c:'toushizu',t:'C09',e:'The road user carries much of the responsibility for traffic accidents: the vehicle driver for the safety of others as well as himself, the pedestrian mainly for his own safety, while the passenger carries relatively little responsibility. Driving is a skill which requires training, and, like other skills, it can be maintained at a high level only by regular practice. The time usually required to train a London bus driver who has never driven before is 50 hours at the wheel. The average private car driver receives considerably less training than this before he drives on his own and proceeds to acquire experience. Increasing experience is a major factor in accident reduction, for inexperienced drivers have high accident rates. Experience cannot be taught, but it can be guided. Studies of training methods for motor vehicle drivers have not been undertaken, but the teaching of defensive driving techniques is important. It may be that good, i.e., safe, drivers anticipate or in some other way avoid pre-accident situations.',j:'道路を利用する人は、交通事故に対する責任は大きい。車を運転する人は自分自身と同じく他人の安全に対して、歩行者は主に自分自身の安全に対して大きな責任があり、一方、乗客は比較的責任は少ない。車の運転は訓練を必要とする技術であり、他の技術と同じように規則的な練習によってのみ高い水準に維持されるものである。車の運転をしたことのない人をロンドンのバスの運転手にする訓練に必要な時間は、普通、50時間の運転時間である。自家用車を運転する人が、ひとりで運転するようになるまでに受ける訓練は、平均するとこれよりかなり少なく、そして次に経験を積み始める。経験がだんだん増えることは、事故を減らす大きな要因である。というのも、経験の浅いドライバーは事故を起こす率が高いからである。経験は教えられるものではないが、指導はできる。車を運転する人のための訓練方法の研究はまだなされていないが、「自衛的な」運転技術を教えるのは重要である。「すぐれた」つまり安全なドライバーというのは、事故が起こる前の状況を事前に察知したり、あるいは何か他の方法でそれを避けるであろう。',a:'tc09.wav'},
{id:'tc10',c:'toushizu',t:'C10',e:'The intelligent person, young or old, meeting a new situation or problem, opens himself up to it; he tries to take in with mind and senses everything he can about it; he thinks about it, instead of about himself or what it might cause to happen to him; he grapples with it boldly, imaginatively, resourcefully, and if not confidently at least hopefully; if he fails to master it, he looks without shame or fear at his mistakes and learns what he can from them. This is intelligence. Clearly its roots lie in a certain feeling about life, and one\'s self with respect to life. Just as clearly, unintelligence is not what most psychologists seem to suppose, the same thing as intelligence but not as much of it. It is an entirely different style of behavior, arising out of an entirely different set of attitudes.',j:'年齢にかかわらず、知性のある人は、ある新しい状況や問題に出くわすと、それに対して心を開く。つまり、知力と感覚を使って、それについて理解できることはすべて理解しようとするのだ。自分自身やそれによって自分に起こることではなく、そのことについて考えるのだ。そして、大胆に、想像力を働かせて、臨機応変に、そしてたとえ確信がなくても、少なくとも希望を抱いて、それに取り組むのだ。もしその状況に打ち勝てなくても、恥じたり恐れたりすることもなく、自分の過ちを見て、その過ちから学べることを学ぶ。これが知性というものだ。知性の根源が、人生およびそれと自己との関わりに対するある種の感情に存在していることは明らかだ。また全く同様に明らかなことだが、知性がないということは、たいていの心理学者が思っているようなもの、つまり、知性と同じものだが、ただしそれが量として不足しているということではない。それは全く異なった行動様式であり、全く異なった一連の考え方から生じるのである。',a:'tc10.wav'},
{id:'tc11',c:'toushizu',t:'C11',e:'He no longer knew why he had come to the city, but it was not for the sake of the bed-sitting room in Dublin, the oblong of dusty garden outside the window, the trams clanging up and down, the shelf full of second-hand books, or the occasional visit to the pictures. Half humorously, half despairingly, he would sometimes clutch his head in his hands and admit to himself that he had no notion of what he wanted. He would have liked to leave it all and go to Glasgow or New York as a labourer, not because he was romantic, but because he felt that only when he had to work with his hands for a living and was no longer sure of his bed would he find out what all his ideals and emotions meant and where he could fit them into the scheme of his life.',j:'彼は自分がどうしてこの町に来たのか今ではわからなくなっていたが、それは、ダブリンの寝室兼居間のためでも、窓の外の長方形のほこりっぽい庭のためでも、ガタゴトと行き交う路面電車のためでも、古本でいっぱいの棚のためでも、時おり出かける映画見物のためでもなかった。なかばおどけたように、またなかばやけくそといったように、彼は時々両手で頭をかかえて、自分が何を望んでいるかわからないということを、心の中で認めるのであった。できることなら、この町を完全に離れて、労働者としてグラスゴーかニューヨークに行きたいと思っていたが、それは彼が夢を追う人間だったからではなく、生計を立てるため自分の手で働かなければならず、もはや寝場所が確保できるかどうかもわからない境遇に身をおいてはじめて、自分の抱く理想や感情のすべてがいかなる意味を持つのか、また、そういった理想や感情をどこで自分の人生計画にはめこめばいいのかがわかるだろう、と感じたからである。',a:'tc11.wav'},
{id:'tc12',c:'toushizu',t:'C12',e:'Man has the ability to make use of various symbols as a means of communicating his thoughts or feelings to others. Words are no more than one kind of such symbols. The use of words in thinking is very much like the use of mathematical symbols in calculation. So amazing is the function of symbols that by the use of mathematical symbols, for instance, we can solve all sorts of problems without weighing or counting actual objects. The same can be said of words; that is, word symbols make it possible to determine the results of particular actions without actually performing them. To put it in another way, with the aid of symbols it becomes possible for the individual to solve problems and arrive at results without going through the slow and clumsy process of trial and error.',j:'人間には、自分の考えや感情を他人に伝える手段として、様々な記号を用いる能力がある。言葉はこうした記号の一種にすぎない。考える際に言葉を使うのは、計算する際に数学的記号を使うのととてもよく似ている。記号の機能は驚くべきものなので、たとえば、数学的記号を使うことによって、われわれは、実際の物体の重さをはかったり、数をかぞえたりしなくても、あらゆる種類の問題を解くことができる。同じことは、言葉についても言える。つまり、言葉という記号によって、実際には行なわなくても、特定の行動の結果を判断することができるのだ。言い方を変えれば、記号の助けによって、個々人は、試行錯誤という、のろのろした不器用な過程を経ずとも、問題を解決し、結果に到達することができるのである。',a:'tc12.wav'},
{id:'tc13',c:'toushizu',t:'C13',e:'Emotions are everywhere the same; but the artistic expression of them varies from age to age and from one country to another. We are brought up to accept the conventions current in the society into which we are born. This sort of art, we learn in childhood, is meant to excite laughter, that to provoke our tears. Such conventions vary with great rapidity, even in the same country.',j:'感情はどこでも同じであるが、その表現の仕方は、時代によって、また国によって様々である。人は、生まれ落ちた社会に広く行きわたっている慣習を受け入れるように育てられる。こう表現すれば笑いをかきたて、ああ表現すれば涙を誘うということを、人は子供のころに身につける。こういった慣習は、同じ国であっても、急速に変わってゆくのである。',a:'tc13.wav'},
{id:'tc14',c:'toushizu',t:'C14',e:'Those of us who live in towns have learned to adjust ourselves to some degree to the kind of overcrowding which seems to be an inevitable consequence of city life; but, the closer we are packed, the more easily resentful of each other do we tend to become. It is probably on this account that many people find life in cities irritating and exhausting, since they are compelled to control aggressive impulses which arise solely as a result of overcrowding. It is also probable that it is because of the wider spacing between individuals which is usual in the countryside that rural folk are less tense, more friendly, and often better mannered than urban people.',j:'われわれの中で都市に住む者は、都会生活には避けられないもののように思われるたぐいの人混みには、ある程度、順応できるようになってきている。しかし、ぎっしりと詰め込まれれば詰め込まれるほど、互いに対してすぐ腹を立てがちである。多くの人々が都会での生活に苛立ち、疲れきってしまうように思うのは、多分、こうした理由からであろう。というのも、ひとえに過密の結果として生じる攻撃的衝動を抑えざるを得ないからである。田舎の人間が都会に住む人間よりも、もっとゆったりとして、打ち解けやすく、礼儀正しい場合が多いのも、おそらくは、田舎ではあたりまえのことではあるが、人と人とを隔てる空間が都市よりも広いからであろう。',a:'tc14.wav'},
{id:'tc15',c:'toushizu',t:'C15',e:'Human beings are talkative creatures and always have been, so far as we can see. It was our urge to communicate with each other and growing ability to do so that was probably the chief factor in the development that made us different from all other animals. Leading anthropologists are now of the opinion that it was not so much aggressiveness as ability to cooperate that gave the earliest forms of man a superiority over others of the ape family, and cooperation entails communication. As far back as 750,000 years ago some primitive men, or hominids, had mastered the use of fire. This signified a great mental advance for it is natural to all animals to fear fire. And only by combining together, passing on acquired knowledge, and making plans could men conquer this fear and turn what had been cause of terror to their own advantage. All this signifies that already they had language of a sort.',j:'人間は話し好きの動物であり、今日のわれわれが知る限りではこれまでもずっとそうだった。恐らくわれわれ人間を他のすべての動物と分けた発達上の主たる要因は、互いに意思を伝え合いたいという衝動とそれを可能にする能力の発達であった。有力な人類学者たちの現在の意見によれば、攻撃性があったということよりもむしろ協力し合う能力があったからこそ、最も初期の人間の集団は、猿という種族の中のその他の集団よりも優位に立つことができたとされているが、協力し合うことには、必ず意思を伝え合うことが伴うのである。今をさかのぼること75万年も前、原始人、つまり原人の中には、すでに火を使用できるようになったものがあった。これは、偉大な精神の進歩を意味したが、それというのも火を恐れることがすべての動物にとっては自然なことだからである。そして、お互いに団結し、獲得された知識を伝え、計画を立てることではじめて、人間はこの恐れを克服し、それまで恐怖の原因であったものを自分自身が利用できるようになったのである。こういったことはすべて、人間がすでにある種の言語を持っていたことを示している。',a:'tc15.wav'},
{id:'tc16',c:'toushizu',t:'C16',e:'Language is certainly an important factor in understanding others. As my Japanese language ability improves, so does my understanding of people. This is also true in learning French, my major at college. It was not until I was fluent in French that I really got to know and appreciate French people. I do not say this is always the case, but language does give insights into a foreign culture that would not be possible otherwise, especially in the case of Japanese who attach much importance to expressions of politeness and agreement. Were I not convinced it is possible to understand one another through language, I would have left Japan long ago.',j:'言語が他の人を理解する場合の重要な要素であるのは確かである。私の日本語の語学力が向上するにつれて、それだけ私は日本人を深く理解するようになる。このことは、私の大学の専攻であるフランス語の学習においても妥当する。フランス語が流暢になってはじめて本当にフランス人を知るようになり、正しく理解するようになったのだ。いつもこうだと言うのではないが、しかし言葉は実に異文化に対する洞察を与えてくれるもので、その洞察力は、言葉を理解していなければ可能とはならないであろう。特に、丁寧さと同意の表現を非常に重視する日本人の場合は、そうであろう。もし私が言語によって相互理解が可能であると確信しているのでなければ、ずっと以前に日本を去っていたであろう。',a:'tc16.wav'},
{id:'tc17',c:'toushizu',t:'C17',e:'Language, like other forms of social activity, has to be appropriate to the speaker using it. This is why, in many communities, men and women\'s speech is different. In certain societies, a man might be laughed to scorn if he used language inappropriate to his sex, just as he would be if, in our society, he were to wear a skirt. This, however, is only a part of the total picture. Behaviour does not only have to be appropriate to the individual, it also needs to fit particular occasions and situations. There are, for example, some circumstances in which a woman who wore a skirt would also be in danger of being laughed at. A woman competing in a running race or going for a swim in a skirt would undoubtedly look somewhat odd, to the point of inviting laughter. This, too, is true of language. To give a sports commentary in the language of the Bible or a church sermon in legal language would be either a bad mistake, or a joke. Language, in other words, varies not only according to the social characteristics of the speaker such as his social class, age and sex but also according to the social situation in which he finds himself. The same speaker uses different linguistic varieties in different situations and for different purposes. The totality of linguistic varieties used in this way and they may be very many by a particular community of speakers can be called that linguistic community\'s verbal repertoire.',j:'言語は、社会的活動の他の形態と同じように、それを使用する話し手にとってふさわしいものでなければならない。こういうわけで、多くの社会集団において、男性と女性の話し言葉が違っているのである。ある社会では、男性は自分の性にふさわしくない言葉を用いると笑われて軽蔑されるかもしれないが、これは、われわれの社会で、もし男性がスカートをはけば、笑われ軽蔑されるのと同様である。しかしながら、これは事態全体の一部であるにすぎない。行動はただ単に個人にとってふさわしいものでなければならないだけではなくて、さらにまた、特定の社会や状況に適合する必要がある。例えば、女性がスカートをはいていても、同様に笑われる危険があると思われる状況が中にはある。女性が、スカートをはいて、競走に参加したり、泳ぎに行ったりすれば、笑いを誘うまでに、いささか奇妙に見えることは疑いないだろう。これは言葉についても同様である。仮に聖書の言葉でスポーツ評論をしたり、法律の言葉で教会の説教をしたりすれば、ひどい失敗か、冗談になるだろう。言い換えれば、言語は、話し手の社会階層とか年齢とか性別といったように社会的特質ばかりではなくて、自分がおかれた社会的状況にも応じて変化する。同じ話し手が様々に違った状況において、様々に違った目的のために、様々な種類の言語を使用する。このようにして、特定の話し手の社会集団によって用いられる言語の種類――これはきわめて多様であるかもしれないが――その全体は、その言語共同体の言語目録と呼ぶことができるのである。',a:'tc17.wav'},
{id:'tc18',c:'toushizu',t:'C18',e:'It is difficult these days not to believe that literature and the arts attract less attention, and science and technology more attention, than a few generations or centuries ago. One often hears it said, in Japan and the West, that young people are not as well educated as they used to be. I am inclined to think that the matter should be stated somewhat differently. It is not that they acquire less education than they once did. It is rather that the emphasis has changed. They are not as interested in language as they once were, and it may also be that the educational system does not work as hard as it once did to arouse this interest.',j:'数世代前、あるいは数世紀前と比べて、文学と諸芸術に対して寄せられる関心は少なくなり、科学と科学技術に寄せられる関心は多くなっていると信じないでいることは、今日では困難である。日本や西洋では、若者は昔ほどよい教育を受けていないと言われるのを耳にすることが多い。私は、この問題は別の角度から述べるべきだという考えに傾いている。昔と比べて若者が受ける教育が少なくなっているのではなく、むしろ教育の力点が変わってきているからだ。若者はかつてほど言語に関心をもっておらず、また、多分、こういった言語に対する関心をかきたてるには、今の教育制度は、昔ほど機能していないのであろう。',a:'tc18.wav'},
{id:'tc19',c:'toushizu',t:'C19',e:'Nature has on the whole been good to man, but nature also has her angry moods, when she seems determined to destroy man and what he has created. Swollen rivers overflowing their banks and flooding the countryside, unseasonable frosts and violent storms destroying crops before they can be harvested, plagues wiping out many thousands of lives; all these are the unfriendly forces of nature. Perhaps the first time man struck back at nature was in the dim past when he decided to go forth from his cave and hunt down the tiger or some other savage animal that threatened his life. Today, of course, the threat of wild beasts in most parts of the world is not great, but man is still hunting his enemies. The hunted beasts have shrunk very greatly in size. Among them are the insects. Still smaller are the creatures that can be seen only through microscopes. Nevertheless, the danger from the tiny living creatures is as real to us today as the danger from the giant fierce beasts was to early man.',j:'自然は概して人間に対しては優しいものであったが、また怒りの気持ちを持つこともあり、そのような場合には、人間と人間が作り出したものを破壊する決心をしているように思われる。堤防からあふれて田園を水浸しにする水かさの増した川、収穫できないうちに作物を駄目にしてしまう季節はずれの霜や暴風雨、何千何万もの人命を奪い取る疫病、こういったものはみな、人間に対して敵意を示す自然の力である。おそらく人間がはじめて自然に反撃を加えたのは、ほら穴から出て、自分の生命を脅かす虎や何か他の動物を狩り立てようと決意した、いつともしれない遠い過去のことだったろう。たしかに、今日では、世界のほとんどの地域で野獣の脅威はたいしたものでなくなっているが、人間は今でも敵を狩り立てている。獲物は、大幅に小型化してきた。それらの中に昆虫も入る。昆虫よりもはるかに小さいのが、顕微鏡でしか見えない生き物である。それにもかかわらず、小さい生物からの危険が、今日のわれわれにとって現実的なものであるのは、大きな獰猛な獣からの危険が、太古の人間にとって現実的なものであったのと変わりはないのである。',a:'tc19.wav'},
{id:'tc20',c:'toushizu',t:'C20',e:'Prehistoric man may well have had as much brain power as has the man of today. Yet modern man probably makes more material progress in a year\'s time than his primitive ancestors made in thousands of years. This is possible because man has developed his means of communication to such a degree that he can learn readily from others and can preserve his discoveries for future generations to build upon. Man\'s greatest invention was not in the use of mechanics, or steam, or electricity, or in taming the forces of the atom. Far more important was his finding out that the noises he makes in his throat when he wishes to express some emotion could be developed into a system which he could use to communicate complex ideas to his fellows.',j:'先史時代の人間にも、今日の人間と同じくらいにものを考える力があったのだろう。しかし、現代の人間は、おそらく、原始時代の祖先が何千年もかけてなしたよりも、多くの物質的進歩を1年の間にやりとげるだろう。こういったことが可能なのは、人間が意思伝達手段を大いに発達させた結果、他の人から容易に物事を学び、これからの世代の人たちが未来を築く土台となる発見を保存することが可能になったからである。人間の最大の発明は、機械技術や蒸気や電気を使用することにあるのでもなければ、原子の力を使いこなすことにあるのでもない。それよりもはるかに重要だったのは、何らかの感情を表現したい時にのどで発する音を発達させて、複雑な観念を他の人間に伝えるために使える一つの体系にできるということを人間が発見したことなのである。',a:'tc20.wav'},
{id:'tc21',c:'toushizu',t:'C21',e:'What is detestable in some critics of poetry is their way of laying down the law and telling us which poets we may read and which we may not. Our choice of reading is our own affair and if we have a genuine feeling for poetry we are just as likely as they are to make a good one. We read the critics because they have given more time and thought than we have to the poets they are discussing and so can be helpful, but in the end our own judgement is the only one that makes for us. Poetry exists to be enjoyed and not minutely dissected and if we know too much about a poem we are likely to enjoy it less. The best critics illustrate their points with ample quotations so that we may judge for ourselves. But how many good critics of poetry have there been in the past fifty years? At the most a dozen.',j:'詩の批評家の中のある人たちについて気に入らないことは、独断的な言い方をして、どの詩人を読み、どの詩人を読んではいけないと言うそのやり方である。われわれが何を読むかはわれわれ自身の問題であって、詩に対する純粋な感受性があれば、われわれとて、彼らと同じように、すぐれた選択ができるだろう。われわれが批評家の書いたものを読むのは、彼らのほうがわれわれよりも、彼らが論じている詩人について多くの時間をかけて多くのことを考えてきたため、われわれにとって役に立つこともあるからであるが、結局のところ、自分自身の判断が自分の役に立つ最良のものなのだ。詩は楽しむためにあるのであって、詳細に分析するために存在するのではない。ある詩についてあまりにも知りすぎているのであれば、その詩を楽しむ度合は減少することであろう。最良の批評家とは、われわれが自分で判断できるよう、数多くの引用を用いて自分の論点を説明するものである。しかし、ここ50年間にすぐれた詩の批評家は何人いただろうか。せいぜい、10人余りといったところだろう。',a:'tc21.wav'},
{id:'tc22',c:'toushizu',t:'C22',e:'My own objection to television is that it gets in the way of contact with the family. There is nothing more dispiriting than to arrive home in the evening to find the children sitting in front of the set, from which they do not move until bedtime. It is important to make time to talk to children and to listen to them. But it is a good thing, too, if children are encouraged to choose. There is not much to be gained from looking in continuously, but there is every reason for letting children decide which programmes they most want to watch and have the television on for those. Perhaps my attitude to television is the rather puritanical one that most people, and especially children, should have something better to do than watch it very much.',j:'私がテレビに反対するのは、テレビが家族の者と交わる邪魔になるという点にある。夜、家に帰ってきて子供がテレビの前に座っているのを見ることほどがっかりすることはなく、子供は寝る時間までそこを動かない。子供に話しかけ子供の話を聞く時間をつくることが大切である。しかし、子供に番組を選ぶようにすすめるとしたら、それもまた良いことである。続けてテレビを見ることから得られるものはあまり多くはないが、子供たちに、どの番組をいちばん見たいと思うか自分で決めて、その番組を見るためにテレビをつけさせることには十分納得のいく理由がある。おそらく、私のテレビに対する態度は、かなり禁欲的なものだろうが、たいていの人、特に子供たちは、テレビをたくさん見るより何かもっと良いことをすべきだというものである。',a:'tc22.wav'},
{id:'tc23',c:'toushizu',t:'C23',e:'During the early days of man\'s existence, life was simple and his pictures, music and other works of art were also simple. As his world grew more and more complex, his art changed in the same way. To be sure, some painters today still give us pictures that are simple and easy to understand and enjoy. Many others, however, are attempting to express things about our inner feeling and moods which cannot be told in words, or even in pictures like any that have ever been painted before. Art is always a reflection. The art of every century is a mirror in which we catch glimpses of the life of that century. The art of yesterday can no more express our life of today than can the cave or mud hut fit our modern housing needs. This does not necessarily mean that the art of other peoples was not often just as beautiful and fine as any we can produce today. Neither does it mean that the artist of one period cannot learn from the past. In art, each new generation makes use of the knowledge and skills of the one before, changing these to fit its own needs.',j:'人間が存在するようになった初期のころは、生活は単純なもので、絵画や音楽やそれ以外の芸術作品も単純なものだった。人間の住む世界がだんだん複雑になるにつれて、芸術も同じように変化した。確かに、今日でも、画家の中には、単純で、容易に理解できて楽しめる絵を描く者がいる。しかしながら、他の多くの画家は、われわれの内面の感情や気分について、言葉で語れず、いや、それどころか今まで描かれてきたどんな絵画でも表現することができない様々な事柄を表現しようとしている。芸術は常に一つの反映である。どの世紀の芸術も、われわれがその時代の生活を垣間見るための鏡である。洞窟や泥の小屋では現代の住宅が求めるものを満たせないのと同様、過去の芸術は今日のわれわれの生活を表現できない。だからと言って、他の時代の人々の芸術が今日われわれが生み出すことのできるどのような芸術と比べても、全くそれに劣らず美しく素晴らしいということはあまりなかったと必ずしも言っているわけではない。また、ある時代の芸術家は過去から学びとることができないと言っているのでもない。芸術においては、新しい世代は各々その前の世代の知識や技術を利用し、そうした知識や技術をその時代の要求に合うように変えていくのである。',a:'tc23.wav'},
{id:'tc24',c:'toushizu',t:'C24',e:'There is no greater obstacle to the enjoyment of great works of art than our unwillingness to discard habits and prejudices. A painting which represents a familiar subject in an unexpected way is often condemned for no better reason than that it does not seem right. The more often we have seen a story represented in art, the more firmly do we become convinced that it must always be represented on similar lines. Though we all know that the Bible tells us nothing about the appearances of Jesus, and that God Himself cannot be visualized in human form, and though we know that it was the artists of the past who first created the images we have become used to, some are still inclined to think that to depart from these traditional forms amounts to blasphemy.',j:'しきたりや偏見を捨てたがらないということほど、偉大な芸術作品を楽しむのに大きな障害となるものはない。見慣れた題材を思いもよらぬ手法で表現する絵画は、正しく見えないというだけの理由で非難されることが多い。ある物語が絵画の中で表現されているのを見る機会が多ければ多いほど、その物語は常に同じような手法で表現されなければならないという確信をますます強めることになる。聖書にはイエス・キリストの容姿については何も記されていないこと、そして神そのものは人間の姿に見えないことを、われわれはみんな知っているとしても、それにわれわれが慣れ親しんできた神のイメージを最初に創造したのは過去の芸術家たちであったことをわれわれは知っているとしても、やはり、このような伝統的な形式から逸脱することは神を冒瀆することになると思いたがる人たちが、なかにはいるのである。',a:'tc24.wav'}
