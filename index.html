<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Folio</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#4338ca"><link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --canvasBg: oklch(92% 0.004 265);
  --bg: oklch(98% 0.003 265);
  --surface: oklch(100% 0 0);
  --surfaceAlt: oklch(95% 0.004 265);
  --text: oklch(15% 0.006 265);
  --textSoft: oklch(46% 0.01 265);
  --border: oklch(88% 0.006 265);
  --primary: oklch(42% 0.2 275);
  --primaryText: oklch(99% 0.003 275);
  --primaryShadow: oklch(46% 0.18 275 / 0.3);
  --accent: oklch(58% 0.19 68);
  --dotColor: oklch(82% 0.008 265);
  --shadowColor: rgba(38,30,90,0.1);
  --cat0: oklch(42% 0.16 275);
  --cat1: oklch(42% 0.16 75);
  --cat2: oklch(42% 0.16 190);
}
.dark {
  --canvasBg: oklch(8% 0.006 265);
  --bg: oklch(13% 0.008 265);
  --surface: oklch(18% 0.01 265);
  --surfaceAlt: oklch(24% 0.012 265);
  --text: oklch(97% 0.004 265);
  --textSoft: oklch(72% 0.01 265);
  --border: oklch(33% 0.014 265);
  --primary: oklch(64% 0.19 275);
  --primaryText: oklch(99% 0.005 275);
  --accent: oklch(75% 0.17 75);
  --dotColor: oklch(30% 0.01 265);
  --shadowColor: rgba(0,0,0,0.4);
  --cat0: oklch(74% 0.15 275);
  --cat1: oklch(74% 0.15 75);
  --cat2: oklch(74% 0.15 190);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,'Hiragino Sans','Yu Gothic',sans-serif;background:var(--canvasBg);background-image:radial-gradient(circle,var(--dotColor) 1px,transparent 1px);background-size:18px 18px;color:var(--text);line-height:1.5;min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:460px;background:var(--bg);min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.header{padding:20px 20px 13px;border-bottom:3px solid var(--primary);background:var(--bg);position:relative;z-index:10;display:flex;justify-content:space-between;align-items:flex-start}
.header-left{display:flex;flex-direction:column}
.logo-row{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.logo-dot1{width:7px;height:7px;border-radius:2px;background:var(--primary)}
.logo-dot2{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--primary)}
.header h1{font-size:24px;font-weight:800;letter-spacing:-0.02em;color:var(--text)}
.back-row{display:flex;align-items:center;gap:10px}
.back-btn{background:none;border:none;font-size:14px;color:var(--text);cursor:pointer;padding:4px 0;font-family:inherit}
.header-title{font-size:16px;font-weight:700;color:var(--text)}
.toggle{width:48px;height:27px;border-radius:999px;border:1px solid var(--border);background:var(--surfaceAlt);cursor:pointer;position:relative;flex-shrink:0;transition:background 0.2s}
.toggle-knob{width:21px;height:21px;border-radius:50%;background:var(--primary);position:absolute;top:2px;left:2px;transition:transform 0.2s ease}
.dark .toggle-knob{transform:translateX(21px)}
.screen{flex:1;min-height:0;overflow-y:auto;padding:0 20px 20px}
.hidden{display:none !important}
/* Hero card */
.hero{border-radius:12px;border:1px solid var(--border);box-shadow:0 8px 24px var(--shadowColor);display:flex;overflow:hidden;margin-bottom:16px;margin-top:16px}
.hero-left{flex:0 0 42%;background:var(--primary);padding:24px 16px;position:relative;clip-path:polygon(0 0,100% 0,88% 100%,0% 100%);background-image:repeating-linear-gradient(135deg,transparent,transparent 4px,rgba(255,255,255,0.08) 4px,rgba(255,255,255,0.08) 5px);overflow:hidden}
.hero-circle{position:absolute;top:-10px;right:-10px;width:72px;height:72px;border:1.5px solid rgba(255,255,255,0.25);border-radius:50%}
.hero-num{font-size:40px;font-weight:800;color:white;position:relative;z-index:1}
.hero-label{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.8);position:relative;z-index:1}
.hero-right{flex:1;background:var(--surface);padding:20px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.hero-stat{display:flex;justify-content:space-between;align-items:center}
.hero-stat-label{font-size:12px;font-weight:600;color:var(--textSoft)}
.hero-stat-val{font-size:17px;font-weight:800;color:var(--text)}
.hero-stat-val.accent-col{color:var(--accent)}
/* Category cards */
.cat-list{display:flex;flex-direction:column;gap:12px}
.cat-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--cat0);border-radius:10px;padding:14px 16px 8px;box-shadow:0 3px 12px var(--shadowColor);cursor:pointer;position:relative}
.cat-card-inner{display:flex;align-items:center;gap:12px}
.cat-badge{width:34px;height:34px;border-radius:8px;background:var(--surfaceAlt);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.cat-info{flex:1}
.cat-name{font-size:16px;font-weight:700;color:var(--text)}
.cat-status{font-size:12px;font-weight:500;color:var(--textSoft)}
.cat-ring{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
.cat-ring-inner{width:31px;height:31px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;position:relative;z-index:1}
.cat-bar{height:3px;border-radius:2px;margin-top:10px;opacity:0.85}
/* Bottom tab */
.tab-bar{display:flex;border-top:1px solid var(--border);background:var(--surface)}
.tab{flex:1;text-align:center;padding:10px 0 12px;cursor:pointer;font-size:13px;font-weight:500;color:var(--textSoft);border-top:3px solid transparent;position:relative}
.tab.active{font-weight:700;color:var(--text);border-top-color:var(--primary)}
.tab.active::before{content:'';position:absolute;top:6px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--primary)}
/* List screen */
.progress-banner{border-radius:12px;padding:16px 20px;margin:16px 0;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden;background-image:repeating-linear-gradient(135deg,transparent,transparent 4px,rgba(255,255,255,0.08) 4px,rgba(255,255,255,0.08) 5px)}
.progress-banner .p-ring{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.progress-banner .p-ring-inner{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:white}
.progress-banner .p-label{font-size:14px;font-weight:700;color:white}
.progress-banner .p-status{font-size:12px;font-weight:500;color:rgba(255,255,255,0.8)}
.mat-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer;box-shadow:0 3px 12px var(--shadowColor)}
.mat-badge{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:white}
.mat-title{flex:1;font-size:16px;font-weight:700;color:var(--text)}
.mat-learned{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.mat-chevron{color:var(--textSoft);font-size:16px}
.fab{position:fixed;bottom:96px;right:calc(50% - 210px);background:var(--primary);color:var(--primaryText);border:none;border-radius:999px;padding:14px 22px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 8px 20px var(--primaryShadow);font-family:inherit;z-index:20}
@media(max-width:460px){.fab{right:20px}}
/* Detail */
.detail-tag{display:inline-block;background:var(--surfaceAlt);border-radius:999px;padding:4px 12px;font-size:11px;font-weight:700;color:var(--textSoft);margin-bottom:16px;margin-top:8px}
.en-text{font-size:19px;line-height:1.85;font-weight:500;color:var(--text);margin-bottom:20px;text-wrap:pretty}
.ja-text{font-size:15px;line-height:1.85;color:var(--textSoft);margin-bottom:24px}
.audio-card{background:var(--surface);border:1px solid var(--border);border-radius:14px 14px 0 0;padding:16px 20px;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;z-index:30;box-shadow:0 -4px 16px var(--shadowColor)}.detail-spacer{height:160px}.vocab-section{margin-top:20px;margin-bottom:8px}.vocab-title{font-size:13px;font-weight:700;color:var(--textSoft);letter-spacing:0.05em;text-transform:uppercase;margin-bottom:8px}.vocab-item{display:flex;align-items:center;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;font-size:14px}.vocab-word{font-weight:600;color:var(--text)}.vocab-mean{color:var(--text);font-size:13px;flex:1;margin-left:12px}.vocab-del{background:none;border:none;color:oklch(55% 0.2 25);cursor:pointer;font-size:16px;padding:0 0 0 8px;font-weight:700}.vocab-add-row{display:flex;gap:6px;margin-top:8px}.vocab-input{flex:1;background:var(--surfaceAlt);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:13px;color:var(--text);font-family:inherit}.vocab-add-btn{background:var(--primary);color:var(--primaryText);border:none;border-radius:8px;padding:10px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}.diff-row{display:flex;gap:8px;margin:16px 0}.diff-btn{flex:1;border:1px solid var(--border);border-radius:10px;padding:12px;font-size:14px;text-align:center;cursor:pointer;background:var(--surfaceAlt);font-family:inherit}.diff-btn.active-hard{background:oklch(90% 0.12 60);border-color:oklch(70% 0.15 60)}.diff-btn.active-easy{background:oklch(90% 0.12 150);border-color:oklch(70% 0.15 150)}.dark .diff-btn.active-hard{background:oklch(30% 0.1 60);border-color:oklch(50% 0.12 60);color:oklch(85% 0.08 60)}.dark .diff-btn.active-easy{background:oklch(30% 0.1 150);border-color:oklch(50% 0.12 150);color:oklch(85% 0.08 150)}
.audio-row{display:flex;align-items:center;gap:12px}
.play-btn{width:52px;height:52px;border-radius:50%;background:var(--primary);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--primaryText);font-size:20px;flex-shrink:0}
.waveform{flex:1;display:flex;align-items:center;gap:2px;height:40px;cursor:pointer}
.wave-bar{width:4px;border-radius:2px;background:var(--border);transition:background 0.1s}
.wave-bar.active{background:var(--primary)}
.time-speed{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.time-label{font-size:12px;font-weight:500;color:var(--textSoft);font-variant-numeric:tabular-nums}
.speed-row{display:flex;gap:6px}
.speed-chip{padding:6px 10px;border-radius:999px;border:none;font-size:12px;font-weight:600;cursor:pointer;background:var(--surfaceAlt);color:var(--text);font-family:inherit}
.speed-chip.active{background:var(--primary);color:var(--primaryText)}
.no-audio{text-align:center;color:var(--textSoft);font-size:14px;padding:20px}
.learned-btn{width:100%;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px}
.learned-btn.off{background:var(--surfaceAlt);color:var(--text)}
.word-hl{background:oklch(88% 0.18 90);border-radius:3px;padding:0 2px;transition:background 0.15s}
.dark .word-hl{background:oklch(55% 0.2 90);color:oklch(97% 0.004 265)}
.learned-btn.on{background:var(--primary);color:var(--primaryText)}
.mode-toggle{display:flex;gap:0;margin-bottom:16px;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.mode-btn{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;background:var(--surfaceAlt);color:var(--textSoft);border:none;font-family:inherit}
.mode-btn.active{background:var(--primary);color:var(--primaryText)}
.ja-hl{background:oklch(88% 0.18 90);border-radius:3px;padding:0 2px;transition:background 0.15s}
.dark .ja-hl{background:oklch(55% 0.2 90);color:oklch(97% 0.004 265)}
/* Add form */
.form-label{font-size:14px;font-weight:700;color:var(--text);margin-top:16px;margin-bottom:6px}
.form-input{width:100%;background:var(--surfaceAlt);border:1px solid var(--border);border-radius:8px;padding:14px;font-size:14px;color:var(--text);font-family:inherit;resize:vertical}
.form-input::placeholder{color:var(--textSoft)}
textarea.form-input{min-height:100px;line-height:1.6}
.save-btn{width:100%;background:var(--primary);color:var(--primaryText);border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;margin-top:20px;font-family:inherit}
/* Records */
.rec-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.rec-card{border-radius:12px;padding:20px;text-align:center;border:1px solid var(--border)}
.rec-card.primary{background:var(--primary);border-color:var(--primary)}
.rec-card.primary .rec-num{color:white;font-size:32px;font-weight:800}
.rec-card.primary .rec-label{color:rgba(255,255,255,0.8);font-size:12px;font-weight:600}
.rec-card.secondary .rec-num{color:var(--accent);font-size:32px;font-weight:800}
.rec-card.secondary .rec-label{color:var(--textSoft);font-size:12px;font-weight:600}
.rec-total{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center;margin-bottom:16px}
.rec-total .rec-num{font-size:24px;font-weight:800;color:var(--text)}
.rec-total .rec-label{font-size:12px;font-weight:600;color:var(--textSoft)}
.rec-section{font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--textSoft);margin:16px 0 8px}
.rec-cat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.empty{color:var(--textSoft);font-size:14px;text-align:center;margin-top:40px}
.mode-ctrl-row{display:flex;gap:8px;margin-top:10px}.mode-ctrl-btn{flex:1;border:1px solid var(--border);border-radius:8px;padding:8px;font-size:12px;font-weight:600;cursor:pointer;background:var(--surfaceAlt);color:var(--textSoft);font-family:inherit}.mode-ctrl-btn.active{background:var(--primary);color:var(--primaryText);border-color:var(--primary)}.seek-bar{width:100%;height:6px;border-radius:3px;-webkit-appearance:none;appearance:none;background:var(--border);outline:none;cursor:pointer;margin:8px 0}.seek-bar::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:var(--primary);cursor:pointer}.seek-bar::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--primary);cursor:pointer;border:none}</style>
</head>
